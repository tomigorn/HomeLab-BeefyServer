# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# CLAMAV ##################################################
# #########################################################
# freshclam + clamd (port 3310 on the internal clamd net, for the SABnzbd/qBittorrent completion hook and the queue worker; S-8: off movie-downloads, so Radarr/Sonarr/Bazarr cannot send SHUTDOWN/RELOAD) + scan.sh for the nightly and manual scans.
  clamav:
    build: ./clamav   # rebuild: see README (build with --network host)
    image: clamav-local:latest
    container_name: clamav
    # Non-root, also for the timer's `docker exec clamav /scan.sh`. 1100 = media (quarantine moves on
    # the hot SSD branches), 65118 = writers of the node-exporter textfile dir.
    user: "65112:65112"
    group_add:
      - "1100"
      - "65118"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # clamd holds the signatures (~1.5G), twice that while it reloads them; the nightly scan uses this clamd (NEW_CLAMD), clamscan only if clamd is down.
    mem_limit: 4g
    restart: unless-stopped
    environment:
      - HOST=beefy
      - SCAN_HOST=0   # the host root is scanned by clamav-hostscan, which has no network
      - SCAN_ROOTS=/scan/ssd-hot /scan/ssd-hot2
      - QUARANTINE=/scan/ssd-hot/quarantine
      - NEW_CLAMD=1      # nightly new-files scan through this clamd, 4 clamdscan at once (MaxThreads 6 leaves 2 for the completion queue); one signature load
      - STATE=/state
      - TEXTFILE=/textfile
    volumes:
      - clamav-db:/var/lib/clamav
      # The hot SSD branches, not the /srv/video union: every new file lands on one of them (ssd-hot first, ssd-hot2 once it is below minfreespace) and the cold HDD never spins up.
      - type: bind
        source: /srv/.disks/ssd-hot
        target: /scan/ssd-hot
        bind:
          create_host_path: false
      - type: bind
        source: /srv/.disks/ssd-hot2
        target: /scan/ssd-hot2
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/clamav-scan
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/clamav-scan/textfile
        target: /textfile
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pgrep freshclam >/dev/null && clamdscan --ping 1 >/dev/null || exit 1"]
      interval: 60s
      retries: 3
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - egress   # freshclam
      - clamd

# #########################################################
# CLAMAV-QUEUE ############################################
# #########################################################
# Background scan of downloaded media (README "Completion scan"): the hook hardlinks media files into /data/.clamav-queue and returns; this worker streams them to clamd one at a time.
  clamav-queue:
    image: clamav-local:latest
    container_name: clamav-queue
    entrypoint: ["python3", "/clamav-hook/clamav-hook.py", "--worker"]
    user: "65112:1100"   # primary gid media: /srv/video is mergerfs, and FUSE ignores supplementary groups
    group_add:
      - "65118"   # textfile-writers: clamav-hook.prom
    read_only: true
    tmpfs:
      - /tmp:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      - clamav
    environment:
      - HOST=beefy
      - CLAMD_HOST=clamav
      - QUEUE=/data/.clamav-queue
      - QUARANTINE=/data/quarantine
      - TEXTFILE=/clamav
      - QBIT_API=http://gluetun:8080
      - PYTHONUNBUFFERED=1
    # Touched before every file; one file takes at most a few minutes.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/clamav-queue-alive) )) -lt 900"]
      interval: 60s
      retries: 3
      start_period: 60s
    volumes:
      # The union, as SABnzbd/qBittorrent see it: a queued link and the imported library file have the same inode there.
      - type: bind
        source: /srv/video
        target: /data
        bind:
          create_host_path: false
      - ./hook:/clamav-hook:ro
      - /etc/localtime:/etc/localtime:ro   # local time in index.txt, as the hook writes it
      - type: bind
        source: /var/lib/clamav-scan/textfile
        target: /clamav
        bind:
          create_host_path: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      clamd: {}
      movie-downloads:
        # pinned: qBittorrent lets this address in without a password (WebUI AuthSubnetWhitelist), to stop and tag an infected torrent
        ipv4_address: 172.28.10.204

# #########################################################
# ClamAV whole-host scan ##################################
# #########################################################
# Weekly, started by clamav-hostscan.timer (`docker compose run --rm clamav-hostscan`), never by `up`. Reads the host, so it has no network.
  clamav-hostscan:
    image: clamav-local:latest
    profiles: ["hostscan"]
    entrypoint: ["/hostscan.sh"]
    user: "0:0"   # a non-root uid has no effective capabilities in Docker, so DAC_READ_SEARCH only works for root
    network_mode: none
    read_only: true
    cpu_shares: 2   # lowest CPU weight (default 1024): Jellyfin night tasks run in the same window
    mem_limit: 6g   # private clamd ~1 GB, scan threads and the 3g tmpfs (archives unpack there)
    restart: "no"
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH   # read every file of the host
      - DAC_OVERRIDE      # write the state dir (owned by 65112) and the textfile dir (group 65118)
      - CHOWN             # hand the results back to 65112 for the clamav container
    environment:
      - HOST=beefy
      - SCAN_HOST=0
      - SCAN_ROOTS=/host
      - USE_CLAMD=1   # private clamd in this container (socket in /tmp, no network), multiscan on all cores
      - SCAN_RESUME=1   # chunked pass, resumes where it stopped (state: all.*); one pass every 6 days
      - SCAN_WINDOW=04:07-04:40   # every night inside the maintenance window (03:58-04:45)
      - SCAN_SUNDAY=0   # beefy is asleep on Sunday daytime
      # Exclusions, why: README "Two containers, why", Scope.
      - SCAN_EXCLUDE_DIRS=/host/var/lib/containerd /host/var/lib/docker/overlay2 /host/var/lib/docker/containerd /host/var/lib/docker/image /host/var/lib/docker/buildkit /host/var/lib/docker/tmp /host/var/lib/snapd/snaps /host/var/lib/snapd/seed /host/home/buntu/backups /host/home/buntu/.cache /host/var/cache/apt /host/srv/appdata/dependency-track/.dependency-track
      - QUARANTINE=/tmp   # unused: `all` is report only, scan.sh just needs an existing directory
      - STATE=/state
      - TEXTFILE=/state/textfile
      - STATE_OWNER=65112:65112
      - TEXTFILE_OWNER=65112:65118
    tmpfs:
      - /tmp:size=3g,mode=1777
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
      - type: bind
        source: /etc/localtime   # the window is local time; the image has no tzdata
        target: /etc/localtime
        read_only: true
      - type: volume
        source: clamav-db
        target: /var/lib/clamav
        read_only: true
      - type: bind
        source: /var/lib/clamav-scan
        target: /state
        bind:
          create_host_path: false

# =========================================================
# Networks ================================================
# =========================================================
# clamd (internal, defined in Movie-Downloads): only clamav, clamav-queue and gluetun (SABnzbd/qBittorrent hook) reach clamav:3310 (S-8). movie-downloads: the queue worker's qBittorrent API access. Start Movie-Downloads first.
networks:
  movie-downloads:
    external: true
  clamd:
    external: true
  egress:
    ipam:
      config:
        - subnet: 172.28.19.0/24

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  clamav-db:
