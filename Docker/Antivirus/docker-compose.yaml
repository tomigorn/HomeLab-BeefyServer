# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# CLAMAV ##################################################
# #########################################################
# freshclam + clamd (port 3310 on movie-downloads, for the SABnzbd/qBittorrent completion hook) + scan.sh for the nightly and manual scans.
  clamav:
    build: ./clamav   # rebuild: see README (build with --network host)
    image: clamav-local:latest
    container_name: clamav
    # Non-root, also for the timer's `docker exec clamav /scan.sh`. 1100 = media (quarantine moves on
    # the ssd-hot branch), 65118 = writers of the node-exporter textfile dir.
    user: "65112:65112"
    group_add:
      - "1100"
      - "65118"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # clamd and a nightly clamscan each hold the signatures (~1.5G), twice that while clamd reloads them.
    mem_limit: 4g
    restart: unless-stopped
    environment:
      - HOST=beefy
      - SCAN_HOST=0   # the host root is scanned by clamav-hostscan, which has no network
      - SCAN_ROOTS=/scan/ssd-hot
      - QUARANTINE=/scan/ssd-hot/quarantine
      - STATE=/state
      - TEXTFILE=/textfile
    volumes:
      - clamav-db:/var/lib/clamav
      # The SSD branch, not the /srv/video union: every new file lands here and the cold HDD never spins up.
      - type: bind
        source: /srv/.disks/ssd-hot
        target: /scan/ssd-hot
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/clamav-scan
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/clamav-scan/textfile
        target: /textfile
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pgrep freshclam >/dev/null && clamdscan --ping 1 >/dev/null || exit 1"]
      interval: 60s
      retries: 3
      start_period: 180s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - movie-downloads

# #########################################################
# CLAMAV-QUEUE ############################################
# #########################################################
# Background scan of downloaded media (README "Completion scan"): the hook hardlinks media files into /data/.clamav-queue and returns; this worker streams them to clamd one at a time.
  clamav-queue:
    image: clamav-local:latest
    container_name: clamav-queue
    entrypoint: ["python3", "/clamav-hook/clamav-hook.py", "--worker"]
    user: "65112:1100"   # primary gid media: /srv/video is mergerfs, and FUSE ignores supplementary groups
    group_add:
      - "65118"   # textfile-writers: clamav-hook.prom
    read_only: true
    tmpfs:
      - /tmp:size=1m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      - clamav
    environment:
      - HOST=beefy
      - CLAMD_HOST=clamav
      - QUEUE=/data/.clamav-queue
      - QUARANTINE=/data/quarantine
      - TEXTFILE=/clamav
      - QBIT_API=http://gluetun:8080
      - PYTHONUNBUFFERED=1
    # Touched before every file; one file takes at most a few minutes.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/clamav-queue-alive) )) -lt 900"]
      interval: 60s
      retries: 3
      start_period: 60s
    volumes:
      # The union, as SABnzbd/qBittorrent see it: a queued link and the imported library file have the same inode there.
      - type: bind
        source: /srv/video
        target: /data
        bind:
          create_host_path: false
      - ./hook:/clamav-hook:ro
      - /etc/localtime:/etc/localtime:ro   # local time in index.txt, as the hook writes it
      - type: bind
        source: /var/lib/clamav-scan/textfile
        target: /clamav
        bind:
          create_host_path: false
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      movie-downloads:
        # pinned: qBittorrent lets this address in without a password (WebUI AuthSubnetWhitelist), to stop and tag an infected torrent
        ipv4_address: 172.28.10.204

# #########################################################
# ClamAV whole-host scan ##################################
# #########################################################
# Weekly, started by clamav-hostscan.timer (`docker compose run --rm clamav-hostscan`), never by `up`. Reads the host, so it has no network.
  clamav-hostscan:
    image: clamav-local:latest
    profiles: ["hostscan"]
    entrypoint: ["/hostscan.sh"]
    user: "0:0"   # a non-root uid has no effective capabilities in Docker, so DAC_READ_SEARCH only works for root
    network_mode: none
    read_only: true
    mem_limit: 3g   # private clamd ~1 GB plus 4+ scan threads
    restart: "no"
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH   # read every file of the host
      - DAC_OVERRIDE      # write the state dir (owned by 65112) and the textfile dir (group 65118)
      - CHOWN             # hand the results back to 65112 for the clamav container
    environment:
      - HOST=beefy
      - SCAN_HOST=0
      # Not the whole disk: / holds ~630k files (Docker layers, /usr) and a scan outlasts beefy's 04:00-04:25 window. These are the writable, user-reachable places.
      - SCAN_ROOTS=/host/home /host/root /host/etc /host/opt /host/usr/local /host/tmp /host/var/tmp /host/srv/appdata
      - USE_CLAMD=1   # private clamd in this container (socket in /tmp, no network), multiscan on all cores
      - QUARANTINE=/tmp   # unused: `all` is report only, scan.sh just needs an existing directory
      - STATE=/state
      - TEXTFILE=/state/textfile
      - STATE_OWNER=65112:65112
      - TEXTFILE_OWNER=65112:65118
    tmpfs:
      - /tmp:size=512m,mode=1777
    volumes:
      - type: bind
        source: /
        target: /host
        read_only: true
      - type: volume
        source: clamav-db
        target: /var/lib/clamav
        read_only: true
      - type: bind
        source: /var/lib/clamav-scan
        target: /state
        bind:
          create_host_path: false

# =========================================================
# Networks ================================================
# =========================================================
# Movie-Downloads' bridge: SABnzbd and qBittorrent (in gluetun's namespace, whose firewall allows this subnet) reach clamd as clamav:3310. Start Movie-Downloads first.
networks:
  movie-downloads:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
volumes:
  clamav-db:
