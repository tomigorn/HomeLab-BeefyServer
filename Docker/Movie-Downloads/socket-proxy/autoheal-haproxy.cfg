global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    maxconn 4000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend dockerbackend
    server dockersocket $SOCKET_PATH

# Allow-list for autoheal (addresses containers by 64-hex ID, so names cannot be filtered): GET only the label-scoped unhealthy list, POST only restart of an ID. IDs of unlabelled containers (Traefik, Authentik, ...) are never listed, and names are denied. Everything else is 403.
frontend dockerfrontend
    bind ${BIND_CONFIG}
    http-request allow if METH_GET { path,url_dec -m reg -i ^/containers/json$ } { query,url_dec -m reg ^filters=\{\x22health\x22:\[\x22unhealthy\x22\],\x22label\x22:\[\x22autoheal-movie=true\x22\]\}$ }
    http-request allow if METH_POST { path -m reg ^/containers/[0-9a-f]{64}/restart$ }
    http-request deny
    default_backend dockerbackend
