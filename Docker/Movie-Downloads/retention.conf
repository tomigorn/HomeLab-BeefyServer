# Storage retention switch (README "Storage retention"). Read by systemd/retention.service and retention-delete.service; no inline comments (systemd).
# Deletion needs BOTH: RETENTION_DELETE=1 and RETENTION_ENABLED_ON=<the day it was switched on, YYYY-MM-DD>. Overdue titles then get 14 days of grace from that day.
RETENTION_DELETE=0
RETENTION_ENABLED_ON=
