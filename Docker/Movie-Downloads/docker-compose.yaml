# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# GLUETUN #################################################
# #########################################################
# Owns the network namespace that every download client lives in (qBittorrent,
# Prowlarr, SABnzbd): if the tunnel drops, their traffic stops with it rather
# than leaking to the WAN. Radarr, Sonarr and Bazarr stay OUT of it - they only
# talk to the LAN and to metadata APIs.
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    container_name: movie-gluetun
    restart: unless-stopped
    # Root by design (creates tun0 + iptables rules); everything else dropped.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - CHOWN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTONVPN_PRIVATE_KEY}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      - TZ=${TZ}
      - PUID=65116   # owner of its files in /gluetun
      - PGID=65116
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      - WIREGUARD_PERSISTENT_KEEPALIVE_INTERVAL=25s
      # Without the bridge subnet here, gluetun's firewall drops the replies to
      # Radarr/Bazarr/SABnzbd and they cannot reach qBittorrent or Prowlarr at
      # all. The LAN subnet is what lets you open the WebUIs from your desktop.
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET},${BRIDGE_SUBNET}
      # Hand the forwarded port straight to qBittorrent. This is gluetun's own
      # hook, which is why this stack has no port-updater container and no
      # docker.sock - unlike the older `mouse` stack on fastpi.
      - VPN_PORT_FORWARDING_UP_COMMAND=/scripts/qbit-port.sh {{PORTS}}
      # Control server (:8000, not published) needs an API key for every route;
      # only vpn-status may read the forwarded port and public IP (README "VPN status").
      - HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH=/gluetun/auth/config.toml
    ports:
      # All of these belong to containers sharing this namespace, so they are
      # published HERE, not on the containers themselves.
      - "${QBITTORRENT_PORT}:8080"        # qBittorrent WebUI
      - "${PROWLARR_PORT}:9696"           # Prowlarr
      - "${SABNZBD_PORT}:8081"            # SABnzbd (8081 inside too: qBittorrent has 8080 here)
    volumes:
      - ${APPDATA_ROOT}/gluetun:/gluetun
      - ./scripts/qbit-port.sh:/scripts/qbit-port.sh:ro
    networks:
      - movie-downloads

# #########################################################
# QBITTORRENT #############################################
# #########################################################
# Shares gluetun's namespace, so it has NO ports and NO networks of its own.
# Reached by the other services as `gluetun:8080`.
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4
    container_name: movie-qbittorrent
    restart: unless-stopped
    # linuxserver non-root mode: s6 and the app run as 65105, no root PID1, no capabilities.
    user: "65105:1100"   # primary gid media: /srv/video is mergerfs, and FUSE ignores supplementary groups
    group_add:
      - "65118"  # textfile-writers: completion-scan metrics
    tmpfs:
      - /run:uid=65105,gid=1100,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - UMASK=${UMASK}
      - WEBUI_PORT=8080
      # The real listening port is set by gluetun's port-forward hook at runtime.
      - TORRENTING_PORT=6881
    volumes:
      - ${APPDATA_ROOT}/qbittorrent:/config
      # ONE mount for the whole tree. Separate /downloads and /movies mounts are
      # the classic mistake: they look like different filesystems to Radarr, so
      # every import becomes a full copy instead of a hardlink.
      - ${DATA_ROOT}:/data
      # Completion scan (README "Completion scan"): the hook script and its metrics file.
      - ../Antivirus/hook:/clamav-hook:ro
      - /var/lib/clamav-scan/textfile:/clamav

# #########################################################
# PROWLARR ################################################
# #########################################################
# Indexer manager. Inside the tunnel because it talks to trackers directly.
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: movie-prowlarr
    restart: unless-stopped
    # linuxserver non-root mode: s6 and the app run as 65103, no root PID1, no capabilities.
    user: "65103:65103"
    tmpfs:
      - /run:uid=65103,gid=65103,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - UMASK=${UMASK}
    volumes:
      - ${APPDATA_ROOT}/prowlarr:/config

# #########################################################
# SABNZBD #################################################
# #########################################################
# Usenet. Shares gluetun's namespace like qBittorrent (since 2026-10-23), so the
# provider sees the VPN IP and nothing leaves without the tunnel. Reached by the
# other services as `gluetun:8081` (port = 8081 in sabnzbd.ini). Downloads land
# locally so Radarr can hardlink.
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3
    container_name: movie-sabnzbd
    restart: unless-stopped
    # linuxserver non-root mode: s6 and the app run as 65106, no root PID1, no capabilities.
    user: "65106:1100"   # primary gid media: /srv/video is mergerfs, and FUSE ignores supplementary groups
    group_add:
      - "65118"  # textfile-writers: completion-scan metrics
    tmpfs:
      - /run:uid=65106,gid=1100,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - TZ=${TZ}
      - UMASK=${UMASK}
    volumes:
      - ${APPDATA_ROOT}/sabnzbd:/config
      - ${DATA_ROOT}:/data
      # Completion scan (README "Completion scan"): the hook script and its metrics file.
      - ../Antivirus/hook:/clamav-hook:ro
      - /var/lib/clamav-scan/textfile:/clamav

# #########################################################
# RADARR ##################################################
# #########################################################
# Movies. Talks to qBittorrent at gluetun:8080 and SABnzbd at gluetun:8081.
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: movie-radarr
    restart: unless-stopped
    # linuxserver non-root mode: s6 and the app run as 65101, no root PID1, no capabilities.
    user: "65101:1100"   # primary gid media: /srv/video is mergerfs, and FUSE ignores supplementary groups
    group_add:
      - "65117"  # hook-secret: secrets/hook/bazarr.apikey
    tmpfs:
      - /run:uid=65101,gid=1100,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ}
      - UMASK=${UMASK}
    volumes:
      - ${APPDATA_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
      # Connect script that sets the profile of a new title (README "Languages").
      - ./scripts:/scripts:ro
      # Bazarr API key for that script (written by scripts/language-policy.sh).
      - ./secrets/hook:/secrets:ro
    ports:
      - "${RADARR_PORT}:7878"
    networks:
      - movie-downloads

# #########################################################
# BAZARR ##################################################
# #########################################################
# Subtitles. Needs the same /data mount because it writes subtitle files next to
# each movie.
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.2
    container_name: movie-bazarr
    restart: unless-stopped
    # linuxserver non-root mode: s6 and the app run as 65104, no root PID1, no capabilities.
    user: "65104:1100"   # primary gid media: /srv/video is mergerfs, and FUSE ignores supplementary groups
    tmpfs:
      - /run:uid=65104,gid=1100,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ}
      - UMASK=${UMASK}
    volumes:
      - ${APPDATA_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${BAZARR_PORT}:6767"
    networks:
      - movie-downloads

# #########################################################
# SONARR ##################################################
# #########################################################
# Series. Same shape as Radarr: one /data mount (hardlinks), qBittorrent at
# gluetun:8080 (category sonarr), SABnzbd at gluetun:8081 (category tv).
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: movie-sonarr
    restart: unless-stopped
    # linuxserver non-root mode: s6 and the app run as 65102, no root PID1, no capabilities.
    user: "65102:1100"   # primary gid media: /srv/video is mergerfs, and FUSE ignores supplementary groups
    group_add:
      - "65117"  # hook-secret: secrets/hook/bazarr.apikey
    tmpfs:
      - /run:uid=65102,gid=1100,exec
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ}
      - UMASK=${UMASK}
    volumes:
      - ${APPDATA_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
      # Connect script that sets the profile of a new title (README "Languages").
      - ./scripts:/scripts:ro
      # Bazarr API key for that script (written by scripts/language-policy.sh).
      - ./secrets/hook:/secrets:ro
    ports:
      - "${SONARR_PORT}:8989"
    networks:
      - movie-downloads

# #########################################################
# RECYCLARR ###############################################
# #########################################################
# Keeps Radarr's and Sonarr's custom formats, scores, quality profiles, quality
# sizes and naming in step with TRaSH Guides. The whole policy is
# ./recyclarr/recyclarr.yml (in git); edit that, not the Radarr/Sonarr UI. Runs
# on its own cron, no ports, no docker.sock. Run a sync by hand with:
#   docker compose run --rm recyclarr sync
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8.7.3
    container_name: movie-recyclarr
    restart: unless-stopped
    user: "65107:65107"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - radarr
      - sonarr
    environment:
      - TZ=${TZ}
      # Inside the nightly window beefy is woken for (03:55), so a sync happens
      # even though the box sleeps most of the day. Missed runs are not caught up.
      - CRON_SCHEDULE=${RECYCLARR_CRON}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_API_KEY=${SONARR_API_KEY}
    volumes:
      # Writable: Recyclarr caches the guide repos and its sync state here.
      - ${APPDATA_ROOT}/recyclarr:/config
      - ./recyclarr/recyclarr.yml:/config/recyclarr.yml:ro
      - ./recyclarr/settings.yml:/config/settings.yml:ro
      - ./recyclarr/custom-formats:/config/custom-formats:ro
    networks:
      - movie-downloads

# #########################################################
# VPN STATUS ##############################################
# #########################################################
# Read-only status page: VPN public IP, forwarded port, qBittorrent's listen port,
# history. Same page as port_updater on fastpi's mouse stack, minus the updating
# (gluetun's own hook sets the port here). README "VPN status".
  vpn-status:
    image: python:3.14.9-alpine3.24
    container_name: movie-vpn-status
    restart: unless-stopped
    user: "65111:65111"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      gluetun:
        condition: service_healthy
    command: ["python3", "/app/web-server.py"]
    environment:
      - TZ=${TZ}
      - PYTHONDONTWRITEBYTECODE=1
      - WEB_PORT=8087
    volumes:
      - ./vpn-status/web-server.py:/app/web-server.py:ro
      - ./secrets/vpn-status.apikey:/run/secrets/gluetun-apikey:ro
      - ${APPDATA_ROOT}/vpn-status:/data
    ports:
      # localhost only, like fastpi's port_updater: ssh -L 8087:127.0.0.1:8087 beefy
      - "127.0.0.1:8087:8087"
    networks:
      - movie-downloads

# =========================================================
# Networks ================================================
# =========================================================
networks:
  movie-downloads:
    name: movie-downloads
    driver: bridge
    ipam:
      config:
        # A /24, not Docker's default /16 - beefy already has 172.17.0.0/16 and
        # 172.18.0.0/16 in use. Keep this in step with BRIDGE_SUBNET in .env.
        - subnet: 172.28.10.0/24

# =========================================================
# Volumes =================================================
# =========================================================
# None. Every piece of state is a bind mount under APPDATA_ROOT or DATA_ROOT, so
# it is all visible on the host and trivial to back up.
