            - name: 4K preferred · older versions allowed - English original
            - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            - name: Swiss German (Mundart) only - any quality
        # No `[HDR Formats] SDR` group: 2160p SDR is allowed (owner 2026-10-26, 4K SDR beats 1080p HDR) and ranks below HDR by the HDR
        # score alone; `SDR` stays only in the Swiss German profile (custom_formats above). Upscales stay rejected (`Upscaled`, Unwanted).
      # Default groups that stay ON: [Audio] Audio Formats, [HDR Formats] HDR,
      # [Streaming Services] General, and for the anime profile its own groups
      # ([Release Groups] Anime, [Required] Anime Versions).

sonarr:
  series:
    base_url: http://sonarr:8989
    # From secrets/recyclarr.yml (mounted as /config/secrets.yml) - never commit the key.
    api_key: !secret sonarr_api_key

    # TRaSH file-size limits per quality (min/preferred/max MB per minute). One
    # table per instance; `series` also serves the anime profile (anime remuxes
    # are rarer and smaller than live-action ones, so the limits fit).
    quality_definition:
      type: series

    media_management:
      propers_and_repacks: do_not_prefer

    # TRaSH "Jellyfin" scheme, TVDB flavour: Sonarr is TVDB-native, so every series
    # has a TVDB id. Jellyfin matches on [tvdbid-...] in the series folder name.
    # Episode and season formats are TRaSH's defaults (no Jellyfin variant exists;
    # Jellyfin parses S01E01 from the file name).
    media_naming:
      series: jellyfin-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_profiles:
      # DEFAULT profile. TRaSH "WEB-2160p (Combined)": WEB 2160p first, WEB 1080p as
      # the lower tier, so a series that has no 4K release gets 1080p now and is
      # upgraded to 4K when one appears. Mirrors the movie profile; WEB rather than
      # Bluray because TV is released on WEB first and Bluray TV encodes are rare.
      # Sonarr has no profile language: `Language: Not Original` (-50000000) is what
      # rejects a release without the original audio.
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        name: 4K HDR - WEB-2160p (1080p fallback)
        reset_unmatched_scores:
          enabled: true
          except:
            - "Language: Original + English"
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 25000000
        min_upgrade_format_score: 1

      # Same profile for English-original titles (scripts/language-policy.sh switches them).
      # `Language: Original + English` stays 0: on an English title it fires on any extra dub.
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        name: 4K HDR - WEB-2160p (1080p fallback) - English original
        reset_unmatched_scores:
          enabled: true
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 20000000
        min_upgrade_format_score: 1

      # Old and rare series, picked per request in Seerr (see the Radarr profile).
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        name: 4K preferred · older versions allowed
        reset_unmatched_scores:
          enabled: true
          except:
            - "Language: Original + English"
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 25000000
        min_upgrade_format_score: 1
        min_format_score: 0
        qualities:
          - name: WEB 2160p
            qualities: [WEBRip-2160p, WEBDL-2160p]
          - name: Bluray-2160p
          - name: WEB 1080p
            qualities: [WEBRip-1080p, WEBDL-1080p]
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEB 720p
            qualities: [WEBRip-720p, WEBDL-720p]
          - name: Bluray-720p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: WEB 480p
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: Bluray-480p
          - name: DVD
          - name: SDTV
          - name: Unknown

      # Same profile for English-original titles (language-policy.sh and the hook switch them), `Language: Original + English` 0.
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        name: 4K preferred · older versions allowed - English original
        reset_unmatched_scores:
          enabled: true
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 20000000
        min_upgrade_format_score: 1
        min_format_score: 0
        qualities:
          - name: WEB 2160p
            qualities: [WEBRip-2160p, WEBDL-2160p]
          - name: Bluray-2160p
          - name: WEB 1080p
            qualities: [WEBRip-1080p, WEBDL-1080p]
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEB 720p
            qualities: [WEBRip-720p, WEBDL-720p]
          - name: Bluray-720p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: WEB 480p
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: Bluray-480p
          - name: DVD
          - name: SDTV
          - name: Unknown

      # Swiss German, same as the Radarr profile (README "Swiss German"): the hook moves series tagged audio-swiss-german here, the tag's release profile is the hard filter, one quality group ranked by the resolution CFs.
      # Sonarr has no profile language; `German` and `Language: Not Original` are 0 here, so a Swiss German dub of a foreign series passes.
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        name: Swiss German (Mundart) only - any quality
        reset_unmatched_scores:
          enabled: true
          except:
            - "Language: Original + English"
        upgrade:
          allowed: true
          until_quality: Any quality
          # Swiss German + 2160p.
          until_score: 1200000
        min_upgrade_format_score: 1
        min_format_score: 0
        qualities:
          - name: Any quality
            qualities: [Bluray-2160p, WEBRip-2160p, WEBDL-2160p, Bluray-1080p, WEBRip-1080p, WEBDL-1080p, HDTV-1080p, Bluray-720p, WEBRip-720p, WEBDL-720p, HDTV-720p, Bluray-576p, Bluray-480p, WEBRip-480p, WEBDL-480p, DVD, SDTV, Unknown]

      # Space saver, picked per series: plain TRaSH "WEB-1080p".
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true
          except:
            - "Language: Original + English"
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 5000000
        min_upgrade_format_score: 1

      # Anime: Seerr sends every series TMDB calls anime here (series type `anime`,
      # same root folder). TRaSH "[Anime] Remux-1080p": Bluray 1080p (remux or
      # encode) first, WEB 1080p below, no Golden Rule (anime is x265 10-bit by
      # default), TRaSH anime group tiers and streaming services. Minimum score
      # 100 is TRaSH's: a release from no known group is skipped.
      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        name: Anime - Bluray + WEB 1080p
        reset_unmatched_scores:
          enabled: true
          except:
            - "Language: Original + English"
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: Bluray 1080p
          until_score: 5000000
        min_upgrade_format_score: 1

