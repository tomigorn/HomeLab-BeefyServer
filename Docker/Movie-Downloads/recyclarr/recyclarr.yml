# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
################################################################################
## Recyclarr -> Radarr + Sonarr (beefy). Syncs TRaSH Guides custom formats,
## scores, quality profiles, quality sizes and the Jellyfin naming scheme.
##
## Edit HERE, never in the Radarr UI: anything Recyclarr manages is overwritten
## on the next sync. Settings Recyclarr does not manage (download clients, root
## folder, Connect, ...) are untouched.
##
## Based on the official templates `uhd-bluray-web` + `hd-bluray-web` (Radarr) and
## `web-2160p-combined` + `web-1080p` (Sonarr), `recyclarr config list templates`.
## See README "Download -> library pipeline" and "Series (Sonarr)".
################################################################################

radarr:
  movies:
    base_url: http://radarr:7878
    # From .env (RADARR_API_KEY) - never commit the key.
    api_key: !env_var RADARR_API_KEY

    # TRaSH file-size limits per quality (min/preferred/max MB per minute).
    quality_definition:
      type: movie

    # TRaSH: with the Repack/Proper custom format doing the work, Radarr's own
    # "prefer and upgrade" must be off or it fights the scores.
    media_management:
      propers_and_repacks: do_not_prefer

    # TRaSH "Jellyfin" scheme, TMDB flavour: Radarr is TMDB-native, so every movie
    # has a TMDB id (not every one has an IMDb id). Jellyfin matches on
    # [tmdbid-...] in the folder name, so identification never guesses.
    media_naming:
      folder: jellyfin-tmdb
      movie:
        rename: true
        standard: jellyfin-tmdb

    quality_profiles:
      # DEFAULT profile. TRaSH "UHD Bluray + WEB" (2160p encodes, 20-60 GB) with
      # TRaSH's documented "combine profiles" option: 1080p Bluray/WEB as a lower
      # tier, so a movie that has no 4K release (yet) still gets 1080p and is
      # upgraded to 4K automatically once one appears.
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        name: 4K HDR - UHD Bluray + WEB (1080p fallback)
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 10000
        min_format_score: 0
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities: [WEBRip-2160p, WEBDL-2160p]
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBRip-1080p, WEBDL-1080p]

      # Space saver, picked per movie: plain TRaSH "HD Bluray + WEB" (6-15 GB).
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

    # The 1080p fallback tier needs the HD group-tier scores that the plain UHD
    # profile has no use for, so a good 1080p Bluray encode beats a poor one.
    # (Quality always ranks first in Radarr: any allowed 2160p beats any 1080p.)
    custom_formats:
      - trash_ids:
          - ed27ebfef2f323e964fb1f61391bcb35  # HD Bluray Tier 01
          - c20c8647f2746a1f4c4262b0fbbeeeae  # HD Bluray Tier 02
          - 5608c71bcebba0a5e666223bae8c9227  # HD Bluray Tier 03
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)

      # German dual audio preferred, TRaSH "German" scoring: German DL (German +
      # original audio) 11000 beats any English-only release of the same quality
      # (best audio + HDR + tier sum is ~7200). A German-only dub is rejected
      # (profile language `Original` filters it too). Because 11000 would lift a
      # -10000 reject above the minimum score, every reject is -35000 as in the
      # TRaSH German profiles; the SDR / DV rules below stay hard rejects.
      - trash_ids:
          - f845be10da4f442654c13e1f2c3d6cd5  # German DL
          - 6aad77771dabe9d3e9d7be86f310b867  # German DL (undefined)
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 11000
          - name: HD Bluray + WEB
            score: 11000
      - trash_ids:
          - 86bc3115eb4e9873ac96904a4a68e19e  # German
          - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
          - cae4ca30163749b891686f95532519bd  # AV1
          - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
          - ed38b889b31be83fda192888e2286d83  # BR-DISK
          - 0a3f082873eb454bde444150b70253cc  # Extras
          - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
          - c465ccc73923871b3eb1802042331306  # Line/Mic Dubbed
          - 90a6f9a284dff5103f6346090e6280c8  # LQ
          - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
          - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
          - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: -35000
          - name: HD Bluray + WEB
            score: -35000
      - trash_ids:
          - 839bea857ed2c0a8e084f3cbdbd65ecb  # x265 (no HDR/DV)
          - 923b6abef9b17f937fab56cfcf89e1f1  # DV (w/o HDR fallback)
          - 9c38ebb7384dada637be8899efa68e6f  # SDR
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: -35000
      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
        assign_scores_to:
          - name: HD Bluray + WEB
            score: -35000

    custom_format_groups:
      add:
        # x265 only where it earns its keep (HDR/DV 4K); 1080p stays x264, which
        # direct-plays everywhere. TRaSH "Golden Rule", one variant per profile.
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d  # [Optional] Golden Rule UHD
          assign_scores_to:
            - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
          assign_scores_to:
            - trash_id: d1d67249d3890e49bc12e275d989a7e9
        # 3D, BR-DISK, LQ groups, upscales, fake "generated" HDR, extras, ...
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
        # Dolby Vision WITHOUT an HDR10 base layer (Profile 5) is rejected: on a
        # non-DV client it plays with green/purple colours, and Jellyfin's tone
        # mapping of P5 (OpenCL path) is untested here. DV *with* HDR10 fallback
        # (P7/P8) is fine and scores like any other HDR release.
        - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76  # [HDR Formats] DV (w/o HDR fallback)
          assign_scores_to:
            - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
        # "4K HDR wherever possible": a 2160p release without HDR is rejected, so
        # an SDR-only 4K (usually an upscale) loses to the 1080p tier instead.
        - trash_id: 47f0d69750de9e16855915fa73bb7b08  # [HDR Formats] SDR
          select:
            - 9c38ebb7384dada637be8899efa68e6f  # SDR
          assign_scores_to:
            - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
      # Default groups that stay ON: [Audio] Audio Formats, [HDR Formats] HDR,
      # [Streaming Services] General.

sonarr:
  series:
    base_url: http://sonarr:8989
    # From .env (SONARR_API_KEY) - never commit the key.
    api_key: !env_var SONARR_API_KEY

    # TRaSH file-size limits per quality (min/preferred/max MB per minute).
    quality_definition:
      type: series

    media_management:
      propers_and_repacks: do_not_prefer

    # TRaSH "Jellyfin" scheme, TVDB flavour: Sonarr is TVDB-native, so every series
    # has a TVDB id. Jellyfin matches on [tvdbid-...] in the series folder name.
    # Episode and season formats are TRaSH's defaults (no Jellyfin variant exists;
    # Jellyfin parses S01E01 from the file name).
    media_naming:
      series: jellyfin-tvdb
      season: default
      episodes:
        rename: true
        standard: default
        daily: default
        anime: default

    quality_profiles:
      # DEFAULT profile. TRaSH "WEB-2160p (Combined)": WEB 2160p first, WEB 1080p as
      # the lower tier, so a series that has no 4K release gets 1080p now and is
      # upgraded to 4K when one appears. Mirrors the movie profile; WEB rather than
      # Bluray because TV is released on WEB first and Bluray TV encodes are rare.
      - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7  # WEB-2160p (Combined)
        name: 4K HDR - WEB-2160p (1080p fallback)
        reset_unmatched_scores:
          enabled: true

      # Space saver, picked per series: plain TRaSH "WEB-1080p".
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        reset_unmatched_scores:
          enabled: true

    # German dual audio preferred, same scoring as the movies: German DL 11000,
    # German-only dub and every reject -35000 (see the Radarr comment).
    custom_formats:
      - trash_ids:
          - ed51973a811f51985f14e2f6f290e47a  # German DL
          - c5dd0fd675f85487ad5bdf97159180bd  # German DL (undefined)
        assign_scores_to:
          - name: 4K HDR - WEB-2160p (1080p fallback)
            score: 11000
          - name: WEB-1080p
            score: 11000
      - trash_ids:
          - 8a9fcdbb445f2add0505926df3bb7b8a  # German
          - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
          - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
          - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
          - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
          - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
          - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
          - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled
        assign_scores_to:
          - name: 4K HDR - WEB-2160p (1080p fallback)
            score: -35000
          - name: WEB-1080p
            score: -35000
      - trash_ids:
          - 9b64dff695c2115facf1b6ea59c9bd07  # x265 (no HDR/DV)
          - 9b27ab6498ec0f31a3353992e19434ca  # DV (w/o HDR fallback)
          - 2016d1676f5ee13a5b7257ff86ac9a93  # SDR
        assign_scores_to:
          - name: 4K HDR - WEB-2160p (1080p fallback)
            score: -35000
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
        assign_scores_to:
          - name: WEB-1080p
            score: -35000

    custom_format_groups:
      add:
        # x265 only for HDR/4K; 1080p stays x264 (direct-plays everywhere).
        - trash_id: e3f37512790f00d0e89e54fe5e790d1c  # [Optional] Golden Rule UHD
          assign_scores_to:
            - name: 4K HDR - WEB-2160p (1080p fallback)
        - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
          assign_scores_to:
            - trash_id: 72dae194fc92bf828f32cde7744e51a1
        # Original audio required (German DL passes: it carries the original track).
        - trash_id: 74aff4168620ed49dcc67e92b2c2a5b4  # [Optional] Language Profiles
        # Boosts the better streaming-service encodes (AMZN, ATVP, DSNP, ...).
        - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
        # BR-DISK, LQ groups, AV1, upscaled, extras, bad dual groups, ...
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
        # Same HDR policy as the movies: Dolby Vision without an HDR10 base layer is
        # rejected (green/purple on non-DV clients), and a 2160p release without HDR
        # (usually an upscale) loses to the 1080p tier.
        - trash_id: d776a1ea912a117d66d83b880ff2055d  # [HDR Formats] DV (w/o HDR fallback)
          assign_scores_to:
            - name: 4K HDR - WEB-2160p (1080p fallback)
        - trash_id: e1053c0ef622df3749fa43c22865663a  # [HDR Formats] SDR
          select:
            - 2016d1676f5ee13a5b7257ff86ac9a93  # SDR
          assign_scores_to:
            - name: 4K HDR - WEB-2160p (1080p fallback)
      # Default groups that stay ON: [HDR Formats] HDR, [Streaming Services] General.
