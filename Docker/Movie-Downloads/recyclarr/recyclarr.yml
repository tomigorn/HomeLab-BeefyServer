# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
################################################################################
## Recyclarr -> Radarr + Sonarr (beefy). Syncs TRaSH Guides custom formats,
## scores, quality profiles, quality sizes and the Jellyfin naming scheme.
##
## Edit HERE, never in the Radarr UI: anything Recyclarr manages is overwritten
## on the next sync. Settings Recyclarr does not manage (download clients, root
## folder, Connect, ...) are untouched.
##
## Based on the official templates `uhd-bluray-web` + `hd-bluray-web` +
## `anime-remux-1080p` (Radarr) and `web-2160p-combined` + `web-1080p` +
## `anime-remux-1080p` (Sonarr), `recyclarr config list templates`.
## See README "Download -> library pipeline", "Series (Sonarr)" and "Languages".
##
## Release scoring (README "Release scoring"), identical in every profile, inside one quality:
##   HDR 20000000 > language tier (original + German + English 7000000 > original + English 5000000
##   > original + German 2000000 > original only 0) > Radarr longer cut 1000000 > audio/group/streaming/repack (< 7000).
## Owner 2026-10-31: only a real (visible or audible) improvement scores; size, bitrate, a season pack or more languages beyond the
## configured ones score 0. Audio ladder (both apps, README "Which version gets downloaded"): lossless formats equal, Atmos/DTS:X a small plus.
## `German DL` = German + original audio (2000000). `Language: Original + English` (5000000) and
## `Extra audio: <language>` (10 each) are native custom formats created by scripts/language-policy.sh,
## not TRaSH ones, hence the `except`/`except_patterns` on every reset_unmatched_scores.
## Every reject is -50000000: the best possible positive sum (~33000000) must stay below the minimum score of 0.
## Radarr 4K/Any: Remux-2160p is allowed in the `WEB 2160p + Remux` group (below Bluray-2160p) with `Remux: smaller encode wins` -6000 (min score -10000 there), so a remux never outranks a 2160p encode.
## 2160p SDR is allowed (owner 2026-10-26: 4K SDR beats 1080p HDR); HDR still beats SDR inside one quality.
## Upgrades stop at 4K HDR + original + English (25000000, Radarr + a longer cut 26000000; English-original twins: HDR + original/English 20000000, German DL is taken at grab time but not chased); the 1080p-only
## HD and anime profiles at original + English (5000000). An upgrade at the
## same quality needs +1 (min_upgrade_format_score, both apps, owner 2026-10-31): below the cutoff any real improvement upgrades (better audio, group, repack, cut, language rung, HDR).
## Radarr (owner 2026-10-30): `Edition: longer cut` 1000000 between the language rungs and audio/group; cutoffs +1000000 (26000000 / 21000000 / 6000000).
## Exception: the profile `Swiss German (Mundart) only - any quality`, Radarr and
## Sonarr (Swiss German mandatory, see its comment and README "Swiss German").
################################################################################

radarr:
  movies:
    base_url: http://radarr:7878
    # From secrets/recyclarr.yml (mounted as /config/secrets.yml) - never commit the key.
    api_key: !secret radarr_api_key

    # TRaSH file-size limits per quality (min/preferred/max MB per minute).
    quality_definition:
      type: movie

    # TRaSH: with the Repack/Proper custom format doing the work, Radarr's own
    # "prefer and upgrade" must be off or it fights the scores.
    media_management:
      propers_and_repacks: do_not_prefer

    # TRaSH "Jellyfin" scheme, TMDB flavour: Radarr is TMDB-native, so every movie
    # has a TMDB id (not every one has an IMDb id). Jellyfin matches on
    # [tmdbid-...] in the folder name, so identification never guesses.
    media_naming:
      folder: jellyfin-tmdb
      movie:
        rename: true
        standard: jellyfin-tmdb

    quality_profiles:
      # DEFAULT profile. TRaSH "UHD Bluray + WEB" (2160p encodes, 20-60 GB) with
      # TRaSH's documented "combine profiles" option: 1080p Bluray/WEB as a lower
      # tier, so a movie that has no 4K release (yet) still gets 1080p and is
      # upgraded to 4K automatically once one appears.
      # Profile language stays `Original` (the TRaSH default): Radarr then rejects
      # every release whose audio does not include the movie's original language,
      # which is exactly "dub only is never acceptable". A `German DL` release
      # passes because it carries the original track.
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        name: 4K HDR - UHD Bluray + WEB (1080p fallback)
        reset_unmatched_scores:
          enabled: true
          except:
            - "Language: Original + English"
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          # 4K HDR + original + English + a longer cut (`Edition: longer cut`) reached = done. A release that also carries German
          # wins at grab time (27000000) but is not chased afterwards; such a file counts as done without the cut too.
          until_score: 26000000
        min_upgrade_format_score: 1
        # A remux (-6000) without a language rung stays grabbable; every reject is -50000000.
        min_format_score: -10000
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p + Remux
            qualities: [WEBRip-2160p, WEBDL-2160p, Remux-2160p]
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBRip-1080p, WEBDL-1080p]

      # Same profile for English-original titles (scripts/language-policy.sh switches them).
      # `Language: Original + English` stays 0: on an English title it fires on any extra dub.
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
        reset_unmatched_scores:
          enabled: true
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 21000000
        min_upgrade_format_score: 1
        # A remux (-6000) without a language rung stays grabbable; every reject is -50000000.
        min_format_score: -10000
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p + Remux
            qualities: [WEBRip-2160p, WEBDL-2160p, Remux-2160p]
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBRip-1080p, WEBDL-1080p]

      # Old and rare titles, picked per request in Seerr (advanced options): every
      # custom format and score of the main 4K profile (languages, rejects, HDR
      # rules), but anything from SDTV/DVD up is allowed, so a title that only
      # exists on DVD is grabbed now and upgraded towards 4K when better appears.
      # language-policy-hook.sh puts new old/niche titles here (README "Old and rare titles"); English originals use the twin below.
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        name: 4K preferred · older versions allowed
        reset_unmatched_scores:
          enabled: true
          except:
            - "Language: Original + English"
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 26000000
        min_upgrade_format_score: 1
        # A remux (-6000) without a language rung stays grabbable; every reject is -50000000.
        min_format_score: -10000
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p + Remux
            qualities: [WEBRip-2160p, WEBDL-2160p, Remux-2160p]
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBRip-1080p, WEBDL-1080p]
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBRip-720p, WEBDL-720p]
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: DVD
          - name: SDTV
          - name: Unknown

      # Same profile for English-original titles (language-policy.sh and the hook switch them), `Language: Original + English` 0.
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        name: 4K preferred · older versions allowed - English original
        reset_unmatched_scores:
          enabled: true
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
          until_score: 21000000
        min_upgrade_format_score: 1
        # A remux (-6000) without a language rung stays grabbable; every reject is -50000000.
        min_format_score: -10000
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p + Remux
            qualities: [WEBRip-2160p, WEBDL-2160p, Remux-2160p]
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBRip-1080p, WEBDL-1080p]
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBRip-720p, WEBDL-720p]
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBRip-480p, WEBDL-480p]
          - name: DVD
          - name: SDTV
          - name: Unknown

      # Swiss German audio is a hard requirement (README "Swiss German"): the hook moves titles tagged audio-swiss-german here, and tags titles added on this profile.
      # One quality group, so a Swiss German release replaces any non-Swiss file, even a better one; the resolution CFs rank inside it.
      # The release profile of the tag is the hard filter (raw release name). `Audio: Swiss German` only ranks: Radarr matches it against the name minus the parsed movie title, so `Title.Swissgerman.2013` misses it, hence no minimum score.
      # Profile language Any is set by scripts/language-policy.sh (Recyclarr does not manage it).
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f  # UHD Bluray + WEB
        name: Swiss German (Mundart) only - any quality
        reset_unmatched_scores:
          enabled: true
          except:
            - "Language: Original + English"
        upgrade:
          allowed: true
          until_quality: Any quality
          # Swiss German + 2160p.
          until_score: 1200000
        min_upgrade_format_score: 1
        min_format_score: 0
        qualities:
          - name: Any quality
            qualities: [Bluray-2160p, WEBRip-2160p, WEBDL-2160p, Bluray-1080p, WEBRip-1080p, WEBDL-1080p, HDTV-1080p, Bluray-720p, WEBRip-720p, WEBDL-720p, HDTV-720p, Bluray-576p, Bluray-480p, WEBRip-480p, WEBDL-480p, DVD, SDTV, Unknown]

      # Space saver, picked per movie: plain TRaSH "HD Bluray + WEB" (6-15 GB).
      - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
          except:
            - "Language: Original + English"
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
          until_score: 6000000
        min_upgrade_format_score: 1

      # Anime films, picked by hand (Seerr has no anime profile for movies): TRaSH
      # "[Anime] Remux-1080p" - Remux/Bluray 1080p first, WEB 1080p below. No
      # Golden Rule here: anime encodes are x265 10-bit as a matter of course.
      # Minimum score 100 is TRaSH's: a release from no known group is skipped.
      - trash_id: 722b624f9af1e492284c4bc842153a38  # [Anime] Remux-1080p
        name: Anime - Remux + WEB 1080p
        reset_unmatched_scores:
          enabled: true
          except:
            - "Language: Original + English"
          except_patterns:
            - "^Extra audio: "
        upgrade:
          allowed: true
          until_quality: Remux 1080p
          until_score: 6000000
        min_upgrade_format_score: 1

    # The 1080p fallback tier needs the HD group-tier scores that the plain UHD
    # profile has no use for, so a good 1080p Bluray encode beats a poor one.
    # (Quality always ranks first in Radarr: any allowed 2160p beats any 1080p.)
    custom_formats:
      # Editions (owner 2026-10-30): a longer cut (own `Edition: longer cut`, recyclarr/custom-formats/radarr: Extended, Director's Cut, Uncut, Unrated, Final Cut, Redux,
      # Special/Ultimate Edition; TRaSH `Special Edition` also hits Anniversary/Collector's/Remastered Editions and TV versions, the same cut) ranks below HDR and every
      # language rung (smallest gap 2000000) and above audio, group and streaming (< 7000), so it wins whenever it exists in the same quality and languages.
      # The cutoffs above add it, so a file at the old cutoff upgrades once to the cut. Swiss German keeps its own scale (2000, below its 50000 resolution steps).
      - trash_ids:
          - 33c3e4c7b642e3e85815cbffefceaeb0  # Edition: longer cut
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 1000000
          - name: 4K preferred · older versions allowed
            score: 1000000
          - name: 4K preferred · older versions allowed - English original
            score: 1000000
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 1000000
          - name: HD Bluray + WEB
            score: 1000000
          - name: Anime - Remux + WEB 1080p
            score: 1000000
          - name: Swiss German (Mundart) only - any quality
            score: 2000
      # Versions, not cuts: TRaSH default scores in the audio/group tier. IMAX (more picture) and a remaster (new transfer) are visible, so they upgrade below the cutoff. Theatrical neutral.
      - trash_ids:
          - eecf3a857724171f968a66cb5719e152  # IMAX
          - 9f6cbff8cfe4ebbc1bde14c7b7bec0de  # IMAX Enhanced
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 800
          - name: 4K preferred · older versions allowed
            score: 800
          - name: 4K preferred · older versions allowed - English original
            score: 800
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 800
          - name: HD Bluray + WEB
            score: 800
          - name: Anime - Remux + WEB 1080p
            score: 800
      - trash_ids:
          - 570bc9ebecd92723d2d21500f4be314c  # Remaster
          - eca37840c13c6ef2dd0262b141a5482f  # 4K Remaster
          - e0c07d59beb37348e975a930d5e50319  # Criterion Collection
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 25
          - name: 4K preferred · older versions allowed
            score: 25
          - name: 4K preferred · older versions allowed - English original
            score: 25
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 25
          - name: HD Bluray + WEB
            score: 25
          - name: Anime - Remux + WEB 1080p
            score: 25
      - trash_ids:
          - e9001909a4c88013a359d0b9920d7bea  # Theatrical Cut
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 0
          - name: 4K preferred · older versions allowed
            score: 0
          - name: 4K preferred · older versions allowed - English original
            score: 0
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 0
          - name: HD Bluray + WEB
            score: 0
          - name: Anime - Remux + WEB 1080p
            score: 0
      # Audio ladder (owner 2026-10-31, README "Which version gets downloaded"), replaces the TRaSH defaults (TrueHD Atmos 5000 > DTS X 4500 > TrueHD 2750 > DTS-HD MA 2500 > FLAC/PCM 2250, AAC 1000 > DD 750)
      # so lossless formats never swap for each other. 4K, Any and Swiss German profiles; HD and anime stay unscored (TRaSH templates). Other audio (MP3, Opus, none) 0.
      # lossless + objects (height channels), equal
      - trash_ids:
          - 496f355514737f7d83bf7aa4d24f8169  # TrueHD ATMOS
          - 2f22d89048b01681dde8afe203bf2e95  # DTS X
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 3000
          - name: 4K preferred · older versions allowed
            score: 3000
          - name: 4K preferred · older versions allowed - English original
            score: 3000
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 3000
          - name: Swiss German (Mundart) only - any quality
            score: 3000
      # lossless = uncompressed, all equal
      - trash_ids:
          - 3cafb66171b47f226146a0770576870f  # TrueHD
          - dcf3ec6938fa32445f590a4da84256cd  # DTS-HD MA
          - a570d4a0e56a2874b64e5bfa55202a1b  # FLAC
          - e7c2fcae07cbada050a0af3357491d7b  # PCM
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 2750
          - name: 4K preferred · older versions allowed
            score: 2750
          - name: 4K preferred · older versions allowed - English original
            score: 2750
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 2750
          - name: Swiss German (Mundart) only - any quality
            score: 2750
      # best lossy: DD+ with height channels (Atmos with no codec named is almost always DD+ from streaming)
      - trash_ids:
          - 1af239278386be2919e1bcee0bde047e  # DD+ ATMOS
          - 417804f7f2c4308c1f4c5d380d4c4475  # ATMOS (undefined)
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 2250
          - name: 4K preferred · older versions allowed
            score: 2250
          - name: 4K preferred · older versions allowed - English original
            score: 2250
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 2250
          - name: Swiss German (Mundart) only - any quality
            score: 2250
      # high-bitrate lossy 7.1
      - trash_ids:
          - 8e109e50e0a0b83a5098b056e13bf6db  # DTS-HD HRA
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 2000
          - name: 4K preferred · older versions allowed
            score: 2000
          - name: 4K preferred · older versions allowed - English original
            score: 2000
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 2000
          - name: Swiss German (Mundart) only - any quality
            score: 2000
      # E-AC3
      - trash_ids:
          - 185f1dd7264c4562b9022d963ac37424  # DD+
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 1750
          - name: 4K preferred · older versions allowed
            score: 1750
          - name: 4K preferred · older versions allowed - English original
            score: 1750
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 1750
          - name: Swiss German (Mundart) only - any quality
            score: 1750
      # DTS core + 6.1 back channel
      - trash_ids:
          - f9f847ac70a0af62ea4a08280b859636  # DTS-ES
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 1000
          - name: 4K preferred · older versions allowed
            score: 1000
          - name: 4K preferred · older versions allowed - English original
            score: 1000
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 1000
          - name: Swiss German (Mundart) only - any quality
            score: 1000
      # DTS core = AC3
      - trash_ids:
          - 1c1a4c5e823891c75bc50380a6866f73  # DTS
          - c2998bd0d90ed5621d8df281e839436e  # DD
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 750
          - name: 4K preferred · older versions allowed
            score: 750
          - name: 4K preferred · older versions allowed - English original
            score: 750
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 750
          - name: Swiss German (Mundart) only - any quality
            score: 750
      # stereo / low channel lossy
      - trash_ids:
          - 240770601cc226190c367ef59aba7463  # AAC
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 500
          - name: 4K preferred · older versions allowed
            score: 500
          - name: 4K preferred · older versions allowed - English original
            score: 500
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 500
          - name: Swiss German (Mundart) only - any quality
            score: 500
      # Remux (owner 2026-10-31): the untouched disc stream (largest); good encodes look the same at a fraction of the size, so they win. Remux-2160p sits in the
      # `WEB 2160p + Remux` group (below Bluray-2160p, above 1080p); -6000 > best audio 3000 + IMAX/IMAX Enhanced 1600 + remasters/Criterion 75 + Repack3 7, so it never outranks a 2160p WEB
      # of the same HDR, languages and cut (no encode -> remux upgrade) but HDR, a language rung or a cut still count. min_format_score -10000 keeps a plain SDR remux grabbable
      # (every reject is -50000000, best positive ~28000000). Own format (recyclarr/custom-formats/radarr/remux.json).
      - trash_ids:
          - 099d9621e51a2d4b088126e3769dc4fb  # Remux: smaller encode wins
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: -6000
          - name: 4K preferred · older versions allowed
            score: -6000
          - name: 4K preferred · older versions allowed - English original
            score: -6000
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: -6000
      - trash_ids:
          - ed27ebfef2f323e964fb1f61391bcb35  # HD Bluray Tier 01
          - c20c8647f2746a1f4c4262b0fbbeeeae  # HD Bluray Tier 02
          - 5608c71bcebba0a5e666223bae8c9227  # HD Bluray Tier 03
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
          - name: 4K preferred · older versions allowed
          - name: 4K preferred · older versions allowed - English original
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
          - name: Swiss German (Mundart) only - any quality

      # German + original audio (TRaSH "German DL"): 2000000 beats any original-only
      # release of the same quality, even with every extra language (< 10000 with audio)
      # but stays below original + English (5000000), owner's order 2026-10-25. "(undefined)" catches German-named
      # releases of German-original titles and DL/ML-tagged ones the parser
      # cannot resolve. The Swiss German profile keeps its own scale (20000).
      - trash_ids:
          - f845be10da4f442654c13e1f2c3d6cd5  # German DL
          - 6aad77771dabe9d3e9d7be86f310b867  # German DL (undefined)
        assign_scores_to:
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback)
            score: 2000000
          - name: 4K preferred · older versions allowed
            score: 2000000
          - name: 4K preferred · older versions allowed - English original
            score: 2000000
          - name: 4K HDR - UHD Bluray + WEB (1080p fallback) - English original
            score: 2000000
          - name: HD Bluray + WEB
            score: 2000000
          - name: Anime - Remux + WEB 1080p
            score: 2000000
          - name: Swiss German (Mundart) only - any quality
            score: 20000
      # Own formats (recyclarr/custom-formats, a local resource provider in recyclarr/settings.yml), scored only in the Swiss German profile.
      # `Audio: Swiss German` = the gsw pattern from scripts/languages.tsv (tests/test_audio_terms.py keeps both equal); it beats any non-Swiss file (upgrade) and lands in the file name.
      # Resolution steps (50000) are larger than the best language + audio + HDR sum (~35000), so resolution ranks first inside the one quality group.
      - trash_ids:
          - 0e7b1cf8e4391882146a4b0799ddb4db  # Audio: Swiss German
        assign_scores_to:
          - name: Swiss German (Mundart) only - any quality
            score: 1000000
      - trash_ids:
          - e28752d7fb8171e503a36be1bb5dce5d  # Resolution: 2160p
        assign_scores_to:
          - name: Swiss German (Mundart) only - any quality
            score: 200000
      - trash_ids:
          - cf0ae35f61d15dcc7e2f6aaf2accdcc3  # Resolution: 1080p
        assign_scores_to:
          - name: Swiss German (Mundart) only - any quality
            score: 150000
      - trash_ids:
