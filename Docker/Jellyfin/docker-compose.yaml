# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# JELLYFIN ################################################
# #########################################################
# Deliberately its own compose project, separate from Movie-Downloads: the
# library it serves should outlive any particular download stack, and a restart
# of the downloaders has no business interrupting playback.
  jellyfin:
    build: .   # lscr.io/linuxserver/jellyfin:12.4ubu2604-ls57 + the Intel OpenCL runtime, see Dockerfile
    image: jellyfin-local:12.4ubu2604-ls57
    container_name: jellyfin
    restart: unless-stopped
    mem_limit: 8g
    # This image has no non-root mode (its service always switches user), so s6 starts as root
    # with only the caps it needs to chown /config and drop to PUID 65108; Jellyfin itself runs as 65108.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    # Reach the IdP over the LAN: avatar images on sso.holy-grail.ch/avatar-img are
    # served to LAN/VPN only (Traefik local-networks); beefy's router DNS would send
    # the plugin via Cloudflare (403). Also keeps OIDC logins off the tunnel.
    extra_hosts:
      - "sso.holy-grail.ch:192.168.1.2"
    environment:
      - PUID=65108
      - PGID=65108
      - TZ=${TZ}
      - UMASK=${UMASK}
      # Only needed so Jellyfin builds correct absolute URLs behind Traefik.
      - JELLYFIN_PublishedServerUrl=${PUBLISHED_SERVER_URL}
    volumes:
      - ${APPDATA_ROOT}/jellyfin:/config
      # READ-ONLY. Jellyfin is a player, not a library manager - Radarr owns the
      # tree. :ro means a misconfigured metadata setting cannot rewrite or delete
      # a movie file.
      - ${MEDIA_ROOT}:/media:ro
      - ../_global/lsio-init/drop-users-group.sh:/custom-cont-init.d/drop-users-group.sh:ro
    devices:
      # Intel UHD 730 on the i5-11400. QuickSync handles transcoding in hardware,
      # which keeps CPU near idle - and on a host that sleeps when idle, that is
      # the difference between "sleeps after a stream" and "never sleeps".
      - /dev/dri:/dev/dri
    group_add:
      # beefy's `render` group. Without it the container cannot open
      # /dev/dri/renderD128 and silently falls back to software transcoding.
      - "${RENDER_GID}"
    ports:
      - "${JELLYFIN_PORT}:8096"
    networks:
      - jellyfin
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

# #########################################################
# POPULAR #################################################
# #########################################################
# Request backend of "Currently popular" (README): checks the caller with Jellyfin
# (/Users/Me, their own token) and requests only titles of the current published
# lists in Seerr. fastpi Traefik routes jellyfin.holy-grail.ch/hss-popular/ here;
# the published port only answers fastpi (DOCKER-USER guard). TV requests: the
# Webhooks plugin posts playback events to jellyfin-popular:8098/hook/<secret>,
# on the jellyfin network only (not published). Seerr facade for Moonfin: 8099, jellyfin network only.
  popular:
    image: python:3.15.2-alpine3.24
    container_name: jellyfin-popular
    restart: unless-stopped
    user: "65128:65128"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python3", "/app/app.py"]
    environment:
      - TZ=${TZ}
      - PYTHONDONTWRITEBYTECODE=1
      - POP_ORIGINS=${PUBLISHED_SERVER_URL}
      - POP_LIMIT=${POPULAR_LIMIT}
      - POP_DAYS=${POPULAR_DAYS}
      - POP_DAILY_MAX=${POPULAR_DAILY_MAX}
      - POP_HOOK_PORT=${POPULAR_HOOK_PORT}
      - POP_HOOK_SECRET_FILE=/run/secrets/popular/hook.secret
      - POP_JELLYFIN_KEY_FILE=/run/secrets/popular/jellyfin.apikey
      - POP_SIGNAL=/signal/requested
      - POP_FACADE_PORT=8099
      - POP_FACADE_SECRET_FILE=/run/secrets/popular/facade.secret
      - POP_EXPORT_FILE=/export/origins.json
    volumes:
      - ./popular:/app:ro
      - ./secrets/popular:/run/secrets/popular:ro
      # allow.json, written by scripts/popular.py
      - ${APPDATA_ROOT}/jellyfin-popular:/data:ro
      # audit.jsonl, the only writable path
      - ${APPDATA_ROOT}/jellyfin-popular-state:/state
      # request-state.json of the night run (badges)
      - ${APPDATA_ROOT}/indexer-bar:/indexer-bar:ro
      # requested: touched after a TV request, starts jellyfin-trending.path
      - ${APPDATA_ROOT}/jellyfin-popular-signal:/signal
      # origins.json: source + requester of each request, read by Seerr's download-now (Seerr README "Request origin")
      - ${APPDATA_ROOT}/jellyfin-popular-export:/export
    ports:
      - "${POPULAR_PORT}:8097"
    networks:
      - jellyfin
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8097/hss-popular/health"]
      interval: 60s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =========================================================
# Networks ================================================
# =========================================================
networks:
  jellyfin:
    name: jellyfin
    driver: bridge
    ipam:
      config:
        # A /24, not Docker's default /16. 172.17/16 and 172.18/16 are already
        # taken on beefy, and Movie-Downloads uses 172.28.10.0/24.
        - subnet: 172.28.11.0/24

# =========================================================
# Volumes =================================================
# =========================================================
# None. Config is a bind mount under APPDATA_ROOT so it is visible on the host
# and easy to back up; the media tree is a read-only bind mount.
