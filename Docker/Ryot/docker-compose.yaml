# =========================================================
# Services ================================================
# =========================================================
# Ryot (watch history & ratings), public at https://tracker.holy-grail.ch through
# fastpi's Traefik (HomeLab-FastPi Docker/Traefik/traefik/dynamic/tracker.yml),
# which reaches it at 192.168.1.102:${RYOT_PORT} (ryot-go: ${RYOT_GO_PORT}); the
# DOCKER-USER rule drops those ports for everyone but fastpi.
services:
# #########################################################
# POSTGRES ################################################
# #########################################################
  ryot-db:
    image: docker.io/library/postgres:18.6-alpine
    container_name: ryot-db
    restart: unless-stopped
    user: "70:70"   # the image postgres user, which owns PGDATA; no root entrypoint
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ryot
      POSTGRES_DB: ryot
      POSTGRES_PASSWORD: ${RYOT_DB_PASSWORD:?database password required}
    volumes:
      - ${APPDATA_ROOT}/ryot-db:/var/lib/postgresql
    networks:
      - ryot

# #########################################################
# RYOT ####################################################
# #########################################################
  ryot:
    image: ghcr.io/ignisda/ryot:${RYOT_TAG:-v10.5.3}
    container_name: ryot
    restart: unless-stopped
    # Image user ryot (1001, unused on this host); it writes into its own /home/ryot, so no other uid.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # the bundled caddy binary carries it as a file capability
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ryot:${RYOT_DB_PASSWORD}@ryot-db:5432/ryot
    # OIDC discovery goes straight to fastpi's Traefik, not via Cloudflare.
    extra_hosts:
      - "sso.holy-grail.ch:192.168.1.2"
    ports:
      - "${RYOT_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/health"]
      start_period: 60s
      interval: 30s
      retries: 5
      timeout: 10s
    depends_on:
      ryot-db:
        condition: service_healthy
    networks:
      - ryot

# #########################################################
# RYOT-GO #################################################
# #########################################################
# /go/tmdb/<movie|show>/<id> -> /media/item/<met_id> (the Jellyfin "Rate in Tracker" link); read-only DB role ryot_go, see README.
  ryot-go:
    build: ./go
    image: ryot-go:local
    container_name: ryot-go
    restart: unless-stopped
    user: "65110:65110"   # dedicated; the image user is 1000 = buntu (sudo) on this host
    environment:
      TZ: ${TZ}
      RYOT_GO_DSN: postgres://ryot_go:${RYOT_GO_DB_PASSWORD:?ryot_go password required}@ryot-db:5432/ryot
    ports:
      - "${RYOT_GO_PORT}:8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      start_period: 10s
      interval: 30s
      retries: 3
      timeout: 5s
    depends_on:
      ryot-db:
        condition: service_healthy
    networks:
      - ryot

# =========================================================
# Networks ================================================
# =========================================================
networks:
  ryot:
    driver: bridge

# =========================================================
# Volumes =================================================
# =========================================================
# None. The database is a bind mount under APPDATA_ROOT (NVMe), dumped nightly by scripts/ryot-db-backup.sh.
