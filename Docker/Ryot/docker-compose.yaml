# =========================================================
# Services ================================================
# =========================================================
# Ryot (watch history & ratings), public at https://tracker.holy-grail.ch through
# fastpi's Traefik (HomeLab-FastPi Docker/Traefik/traefik/dynamic/tracker.yml),
# which reaches it at 192.168.1.102:${RYOT_PORT}; the DOCKER-USER rule drops that
# port for everyone but fastpi.
services:
# #########################################################
# POSTGRES ################################################
# #########################################################
  ryot-db:
    image: docker.io/library/postgres:18.6-alpine
    container_name: ryot-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ryot
      POSTGRES_DB: ryot
      POSTGRES_PASSWORD: ${RYOT_DB_PASSWORD:?database password required}
    volumes:
      - ${APPDATA_ROOT}/ryot-db:/var/lib/postgresql
    networks:
      - ryot

# #########################################################
# RYOT ####################################################
# #########################################################
  ryot:
    image: ghcr.io/ignisda/ryot:${RYOT_TAG:-v10.5.3}
    container_name: ryot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ryot:${RYOT_DB_PASSWORD}@ryot-db:5432/ryot
    # OIDC discovery goes straight to fastpi's Traefik, not via Cloudflare.
    extra_hosts:
      - "sso.holy-grail.ch:192.168.1.2"
    ports:
      - "${RYOT_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/health"]
      start_period: 60s
      interval: 30s
      retries: 5
      timeout: 10s
    depends_on:
      ryot-db:
        condition: service_healthy
    networks:
      - ryot

# =========================================================
# Networks ================================================
# =========================================================
networks:
  ryot:
    driver: bridge

# =========================================================
# Volumes =================================================
# =========================================================
# None. The database is a bind mount under APPDATA_ROOT (NVMe), dumped nightly by scripts/ryot-db-backup.sh.
