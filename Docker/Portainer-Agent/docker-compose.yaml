# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# PORTAINER AGENT #########################################
# #########################################################
  agent:
    # IMPORTANT: the agent version MUST match the Portainer SERVER version running on
    # fastpi (the Pi) — a mismatched major/minor can fail to connect. Set via
    # PORTAINER_AGENT_TAG in .env, and bump it whenever you upgrade Portainer on fastpi.
    image: portainer/agent:${PORTAINER_AGENT_TAG}
    container_name: portainer_agent
    restart: always
    mem_limit: 256m
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    # No /:/host mount: it only serves Business-edition host management.
    # Without AGENT_SECRET the agent trusts whichever Portainer connects first after a start.
    # Stays in env: the agent has no file option and the image no shell (_global/docs/secrets-as-files.md).
    environment:
      - AGENT_SECRET=${AGENT_SECRET:?set AGENT_SECRET in .env}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# =========================================================
# Networks ================================================
# =========================================================
# (none — the agent uses the default bridge network)

# =========================================================
# Volumes =================================================
# =========================================================
# (none — the agent is stateless; it only bind-mounts host paths above)
