# Nightly image auto-update (scripts/auto_update.py, the same file as fastpi's; auto-update.timer 04:12, nothing starts after 04:16). Doc: README.md "Image auto-update"
# Only the digest behind the tag written in the repo moves. Not listed = not touched. Local builds (Jellyfin, clamav, FlareSolverr, LibreTranslate) show as local_build: rebuilt weekly by rebuild-local.conf (FlareSolverr: its own timer flaresolverr-rebuild, Movie-Downloads README).
# Columns: tier  project  services(-=all)  backups for update-project.sh (-=none)  functional check (shell, -=container checks only)
# tier: auto = applied after the cool-down, verified, rolled back | notify = Telegram with the command
# auto first: the window is short, the rest is only reported.

# Pinned version tags: a new digest is a rebuild of the same version (base-image patches). No floating tags left (autoheal is digest-pinned, notify).
auto    Movie-Downloads  flaresolverr,recyclarr,vpn-status  -  docker exec movie-flaresolverr curl -sf -m 60 -X POST http://127.0.0.1:8191/v1 -H 'Content-Type: application/json' -d '{"cmd":"request.get","url":"https://example.com/","maxTimeout":45000}' | grep -q '"status": "ok"' && curl -sf http://127.0.0.1:8087/ | grep -q 'VPN Port Status' && docker exec movie-recyclarr recyclarr --version
auto    Cup-Agent        cup-agent,socket-proxy-unix  -  curl -sf http://127.0.0.1:8000/api/v3/json | grep -q '"images"'
# Seerr sidecars, stateless (owner 2026-11-11). Seerr itself is our own image (seerr-local, weekly timer seerr-rebuild, Seerr README "Own image"), not listed.
auto    Seerr            seerr-proxy   -  curl -sfL -m 8 http://127.0.0.1:5055/ | grep -q '/_indexer-bar/bar.js' && curl -sf -m 8 http://127.0.0.1:5055/_indexer-bar/health | grep -q ok
auto    Seerr            download-now  -  docker exec seerr-download-now wget -qO- http://127.0.0.1:8090/_download-now/health | grep -q '"ok": true' && curl -sf -m 8 http://127.0.0.1:5055/_download-now/health | grep -q '"ok": true'

# docker.sock behind them (like fastpi's Docker-Socket-Proxy, autoheal and Cup): a human looks first.
notify  Cup-Agent        socket-proxy-ro  -  -
notify  Movie-Downloads  autoheal,socket-proxy-heal  -  -

# Stateful or DB-migrating: a new version may migrate data one way, so a human runs the command (it backs up first).
# gluetun: recreating it cuts the network namespace of qBittorrent, Prowlarr, SABnzbd and FlareSolverr.
notify  Movie-Downloads  gluetun,qbittorrent,prowlarr,sabnzbd,radarr,sonarr,bazarr  /srv/appdata/gluetun,/srv/appdata/qbittorrent,/srv/appdata/prowlarr,/srv/appdata/sabnzbd,/srv/appdata/radarr,/srv/appdata/sonarr,/srv/appdata/bazarr  -
# Floppy: pinned by digest, weekly AI-written releases with one-way migrations: read the notes first.
notify  Floppy           -  /srv/appdata/floppy,/srv/appdata/floppy-redis  -
notify  Dependency-Track -  /srv/appdata/dt5-db  -
notify  Jellyfin         -  /srv/appdata/jellyfin  -
notify  Antivirus        -  -  -
# Lingarr migrates its sqlite DB. LibreTranslate is a local build (libretranslate-local, rebuild-local.conf).
notify  Subtitle-Translate  -  /srv/appdata/lingarr  -
# The agent must match fastpi's Portainer server (notify there too).
notify  Portainer-Agent  -  -  -
