# Weekly rebuild of beefy's locally built images (scripts/rebuild_local.py, the same file as fastpi's; rebuild-local.timer 04:27 in the maintenance window). Doc: README.md "Image auto-update".
# One [[image]] per project. Keys:
#   project   dir under Docker/, or an absolute path (another repo's compose)
#   day       Mon..Sun: the night it runs (Tue Seerr, Wed key rotation, Thu FlareSolverr already hold 04:27)
#   services  compose services to recreate (default: every service with build:)
#   build     own build command instead of "docker compose build --pull --no-cache <services>" (beefy builds need --network host: the DOCKER-USER guard drops a build container's DNS); context = where its Dockerfile is
#   unittest  shell command run in the new image (first service): network none, user 65534, the project dir read-only at /src
#   test      host shell command; $IMAGE and $IMAGE_<SERVICE> are the new image ids
#   check     functional check after the recreate (update-project.sh CHECK); the post-update check runs on top (post-update.d/<dir>.sh)
#   backups   update-project.sh backup paths (none: a rebuild keeps the pinned version, nothing migrates)
#   guard     shell command run before the build and again before the recreate; non-zero = deferred to next week, no alert (last output line = reason)
# Not here: seerr-local (seerr-rebuild.timer, Seerr README) and flaresolverr-local (flaresolverr-rebuild.timer, Movie-Downloads README) keep their own weekly jobs. Pulled images (python, nginx, ...) are auto-update.conf's.

[[image]]
project = "Antivirus"
day = "Mon"
services = ["clamav", "clamav-queue"]
build = "docker build --network host --pull --no-cache -q -t clamav-local:latest ./clamav"
context = "/home/buntu/Projects/Docker/Antivirus/clamav"
unittest = "sh /src/tests/test_scan.sh"
check = "docker exec clamav pgrep freshclam"
# the nightly scans run inside the clamav container: wait up to 15 min for them to end
guard = "for i in $(seq 30); do systemctl is-active -q clamav-scan.service clamav-hostscan.service || { echo no scan running; exit 0; }; sleep 30; done; echo clamav scan still running"

[[image]]
project = "Jellyfin"
day = "Sat"
services = ["jellyfin"]
build = "docker build --network host --pull --no-cache -q -t \"$(docker compose config --images jellyfin)\" ."
context = "/home/buntu/Projects/Docker/Jellyfin"
test = "docker run --rm --network none --entrypoint sh \"$IMAGE\" -c 'test -x /usr/lib/jellyfin/bin/jellyfin && ls /etc/OpenCL/vendors | grep -q intel_legacy1.icd && dpkg -s intel-opencl-icd >/dev/null'"
check = "curl -sf -m 10 http://127.0.0.1:8096/health | grep -q Healthy"
# never restarts Jellyfin while someone is playing
guard = "python3 scripts/no-playback.py"
