# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# SEERR ###################################################
# #########################################################
# Request manager for Jellyfin (Overseerr + Jellyseerr merged into Seerr, v3).
# Users browse TMDB and request a film or a series; approved requests go to
# Radarr/Sonarr over the movie-downloads bridge and the library status comes
# from Jellyfin over its bridge. Public at https://requests.holy-grail.ch behind
# Authentik (group streaming-users); see README for how the login works.
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    container_name: seerr
    restart: unless-stopped
    # The image ships no init process and runs as `node` (1000:1000), which is
    # the shared media identity here, so /app/config needs no chown.
    init: true
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=${LOG_LEVEL}
      - PORT=5055
    volumes:
      - ${APPDATA_ROOT}/seerr:/app/config
    ports:
      - "${SEERR_PORT}:5055"
    networks:
      - movie-downloads
      - jellyfin
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

# =========================================================
# Networks ================================================
# =========================================================
# Both bridges already exist; Seerr joins them so it reaches radarr:7878,
# sonarr:8989 and jellyfin:8096 by container name, with no host-port detour.
networks:
  movie-downloads:
    external: true
  jellyfin:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
# None. Config (settings.json with the API key, SQLite db, logs) is a bind mount
# under APPDATA_ROOT, visible on the host and easy to back up.
