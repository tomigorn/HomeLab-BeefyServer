# =========================================================
# Services ================================================
# =========================================================
services:
# #########################################################
# SEERR ###################################################
# #########################################################
# Request manager for Jellyfin (Overseerr + Jellyseerr merged into Seerr, v3).
# Users browse TMDB and request a film or a series; approved requests go to
# Radarr/Sonarr over the movie-downloads bridge and the library status comes
# from Jellyfin over its bridge. Public at https://requests.holy-grail.ch behind
# Authentik (group streaming-users); see README for how the login works.
  seerr:
    # Temporary until OIDC ships in a release: the preview-new-oidc build of PR #2715
    # (README "Preview image"), pinned by digest. Back to stable: README "Back to stable".
    image: ghcr.io/seerr-team/seerr:preview-new-oidc@sha256:28744b1ced522beb7af8e5c966b73c6e46b1dc2c4c8cb497ad2f12d3139699a3
    container_name: seerr
    restart: unless-stopped
    mem_limit: 2g
    # The image ships no init process and runs as `node` (1000:1000), which is
    # the shared media identity here, so /app/config needs no chown.
    init: true
    user: "65109:65109"   # dedicated; the image user node is 1000 = buntu (sudo) on this host
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    # sso straight to fastpi over the LAN (DOCKER-USER allows the jellyfin subnet to 192.168.1.2:443); not via Cloudflare
    extra_hosts:
      - "sso.holy-grail.ch:192.168.1.2"
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=${LOG_LEVEL}
      - PORT=5055
    volumes:
      - ${APPDATA_ROOT}/seerr:/app/config
    # No published port: seerr-proxy below owns SEERR_PORT and reaches Seerr as seerr:5055 on seerr-front.
    networks:
      seerr-front: {}
      movie-downloads: {}
      jellyfin:
        # default route stays on jellyfin: DOCKER-USER lets only that subnet reach sso on fastpi :443
        gw_priority: 10
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

# #########################################################
# SEERR-PROXY #############################################
# #########################################################
# Indexer bar (README "Indexer bar"): nginx in front of Seerr on SEERR_PORT. Passes everything
# through and adds the bar's <link> + <script> to HTML pages; serves bar.js/bar.css and the
# usage.json that scripts/indexer-usage.py (host timer) writes. Remove this service and give
# seerr its port back to drop the bar.
  seerr-proxy:
    image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24
    container_name: seerr-proxy
    restart: unless-stopped
    user: "65124:65124"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx directly: the image's entrypoint scripts want to rewrite conf.d
    entrypoint: ["nginx", "-g", "daemon off;"]
    tmpfs:
      - /tmp:uid=65124,gid=65124,mode=0700,size=64m
    volumes:
      - ./indexer-bar/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./indexer-bar/www:/srv/indexer-bar/www:ro
      - ${APPDATA_ROOT}/indexer-bar:/srv/indexer-bar/data:ro
    ports:
      - "${SEERR_PORT}:8080"
    networks:
      - seerr-front
    depends_on:
      seerr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/_indexer-bar/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# #########################################################
# DOWNLOAD-NOW ############################################
# #########################################################
# Backend of the "Download now" button on the title page (README "Download now"). seerr-proxy sends
# /_download-now/ here; every call is checked against Seerr (admin / manage-requests, or the caller's own request).
# Holds the Radarr/Sonarr/SABnzbd keys (secrets/download-now, scripts/download-now-setup.sh); qBittorrent
# lets 172.28.10.205 in without a password. Publishes nothing.
  download-now:
    image: python:3.15.2-alpine3.24
    container_name: seerr-download-now
    restart: unless-stopped
    user: "65127:65127"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["python3", "/app/download_now.py"]
    environment:
      - TZ=${TZ}
      - PYTHONDONTWRITEBYTECODE=1
      - DN_ORIGINS=https://requests.holy-grail.ch
      - DN_ORIGINS_FILE=/run/origins/origins.json
    volumes:
      - ./download-now:/app:ro
      - ./secrets/download-now:/run/secrets/download-now:ro
      # origins.json of Jellyfin's popular backend (README "Request origin")
      - ${APPDATA_ROOT}/jellyfin-popular-export:/run/origins:ro
    networks:
      seerr-front: {}
      movie-downloads:
        # pinned: qBittorrent lets this address in without a password (WebUI AuthSubnetWhitelist)
        ipv4_address: 172.28.10.205
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8090/_download-now/health"]
      interval: 60s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    pids_limit: 64
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =========================================================
# Networks ================================================
# =========================================================
# movie-downloads and jellyfin already exist; Seerr joins them so it reaches radarr:7878,
# sonarr:8989 and jellyfin:8096 by container name, with no host-port detour.
# seerr-front: only seerr-proxy, seerr and download-now. Outbound into the LAN is dropped by DOCKER-USER.
networks:
  seerr-front:
    name: seerr-front
  movie-downloads:
    external: true
  jellyfin:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
# None. Config (settings.json with the API key, SQLite db, logs) is a bind mount
# under APPDATA_ROOT, visible on the host and easy to back up.
