# Data paths (/_indexer-bar/*.json, /_download-now/) need a Seerr session: auth_request asks Seerr GET /api/v1/auth/me with the caller's own cookie, 401/403 = refused.
# seerr-proxy (README "Indexer bar", "Can wait", "Menu links", "Night label", "Download now", "My request", "Request sizes", "Request origin", "Manual interaction"): everything goes to Seerr unchanged, HTML pages get the bar's and menu-links' <link>, the shared hint box tip.js first (README "Hint boxes"), the bar's <script> and the can-wait / menu-links / night-label / download-now / my-request / request-sizes / request-origin / manual scripts before </head>; /_download-now/ goes to the download-now backend; /_manual/ redirects to /manual (Manual interaction inside Seerr's page).
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    # Seerr's own compression is turned off below (sub_filter), so compress here again.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # session check results (200 only, 10 s), keyed by the caller's own credentials
    proxy_cache_path /tmp/auth_cache levels=1 keys_zone=seerr_auth:1m max_size=1m inactive=1m;

    # Docker DNS, re-resolved every 10 s: a recreated seerr container gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # GB sort (README "Request sizes"): Seerr's own list call with hg_size=<mode> is answered by the download-now backend, sorted by size
    map "$request_method:$uri:$arg_hg_size" $hg_size_sort {
        "~^GET:/api/v1/request:[a-z-]+$" 1;
        default "";
    }

    # our scripts and styles: a year in the browser for the URL of the current version (?v=, scripts/bar-assets.sh), no-cache for any other; private, so no shared cache keeps them
    map "$arg_v:$hg_v" $hg_asset_cache {
        "~^([0-9a-f]{12}):\1$" "private, max-age=31536000, immutable";
        default "no-cache";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    server {
        listen 8080;
        # relative Location headers: behind Traefik an absolute one would name this container's port
        absolute_redirect off;

        # sha256 of indexer-bar/www, written by scripts/bar-assets.sh on every change there (seerr-bar-assets.path); missing = no version, nothing cached
        set $hg_v "";
        include /srv/indexer-bar/data/asset-version*.conf;

        location = /_indexer-bar/health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /_indexer-bar/_auth {
            internal;
            set $seerr_auth http://seerr:5055;
            proxy_pass $seerr_auth/api/v1/auth/me;
            proxy_http_version 1.1;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $http_host;
            proxy_set_header Accept-Encoding "";
            proxy_cache seerr_auth;
            proxy_cache_key "$http_cookie|$http_x_api_key|$http_x_api_user";
            proxy_cache_valid 200 10s;
            proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
            proxy_hide_header Set-Cookie;
            proxy_read_timeout 10s;
        }

        location = /_indexer-bar/usage.json {
            auth_request /_indexer-bar/_auth;
            alias /srv/indexer-bar/data/usage.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        location = /_indexer-bar/night-waiting.json {
            auth_request /_indexer-bar/_auth;
            alias /srv/indexer-bar/data/night-waiting.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        location = /_indexer-bar/request-state.json {
            auth_request /_indexer-bar/_auth;
            alias /srv/indexer-bar/data/request-state.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        # Download now backend: checks the Seerr session itself, holds the Radarr/Sonarr/qBittorrent/SABnzbd keys.
        location = /_download-now/health {
            set $download_now http://download-now:8090;
            proxy_pass $download_now;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            add_header Cache-Control "no-store" always;
        }

        location ^~ /_download-now/ {
            auth_request /_indexer-bar/_auth;
            set $download_now http://download-now:8090;
            proxy_pass $download_now;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            client_max_body_size 4k;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-store" always;
        }

        # Manual interaction backend: a release search asks every indexer (up to 2 min), an import sends a file list.
        location ^~ /_download-now/manual/ {
            auth_request /_indexer-bar/_auth;
            set $download_now http://download-now:8090;
            proxy_pass $download_now;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            client_max_body_size 16k;
            proxy_read_timeout 150s;
            add_header Cache-Control "no-store" always;
        }

        # Manual interaction lives at /manual inside Seerr's layout (manual.js); old links of the first version go there
        location ~ ^/_manual/?$ {
            return 302 /manual;
        }

        location /_indexer-bar/ {
            alias /srv/indexer-bar/www/;
            add_header Cache-Control $hg_asset_cache always;
        }

        # Jellyfin sign-in (password, Quick Connect) is refused: Quick Connect ignores mediaServerLogin, so a Jellyfin-linked account could skip the OIDC step. Case-insensitive like Seerr's router.
        location ~* ^/api/v1/auth/jellyfin {
            default_type text/plain;
            return 403 "forbidden\n";
        }

        location / {
            if ($hg_size_sort) {
                rewrite ^ /_download-now/by-size last;
            }
            set $seerr http://seerr:5055;
            proxy_pass $seerr;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # uncompressed from Seerr, or sub_filter cannot see </head>
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            sub_filter_once on;
            sub_filter "</head>" '<link rel="stylesheet" href="/_indexer-bar/bar.css?v=$hg_v"><link rel="stylesheet" href="/_indexer-bar/menu-links.css?v=$hg_v"><script src="/_indexer-bar/tip.js?v=$hg_v" defer></script><script src="/_indexer-bar/bar.js?v=$hg_v" data-ib-data="/_indexer-bar/usage.json" data-ib-no-bar="^/(login|setup|resetpassword)\b" data-ib-lang-hook="hgNightLabel" data-ib-lang-probe=\'a[href="/discover/tv"]\' data-ib-lang-de="Serien" defer></script><script src="/_indexer-bar/can-wait.js?v=$hg_v" defer></script><script src="/_indexer-bar/menu-links.js?v=$hg_v" defer></script><script src="/_indexer-bar/night-label.js?v=$hg_v" defer></script><script src="/_indexer-bar/download-now.js?v=$hg_v" defer></script><script src="/_indexer-bar/my-request.js?v=$hg_v" defer></script><script src="/_indexer-bar/request-sizes.js?v=$hg_v" defer></script><script src="/_indexer-bar/request-origin.js?v=$hg_v" defer></script><script src="/_indexer-bar/manual.js?v=$hg_v" defer></script></head>';

            # Seerr not up yet (beefy just woke): a page that reloads itself instead of a bare 502.
            error_page 502 504 =503 /_indexer-bar/starting.html;
        }
    }
}
