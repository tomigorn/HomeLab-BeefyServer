# seerr-proxy (README "Indexer bar", "Can wait", "Menu links", "Night label", "Download now"): everything goes to Seerr unchanged, HTML pages get the bar's <link> + <script> and the can-wait / menu-links / night-label / download-now scripts before </head>; /_download-now/ goes to the download-now backend.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    # Seerr's own compression is turned off below (sub_filter), so compress here again.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Docker DNS, re-resolved every 10 s: a recreated seerr container gets a new IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    server {
        listen 8080;

        location = /_indexer-bar/health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /_indexer-bar/usage.json {
            alias /srv/indexer-bar/data/usage.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        location = /_indexer-bar/night-waiting.json {
            alias /srv/indexer-bar/data/night-waiting.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        location = /_indexer-bar/request-state.json {
            alias /srv/indexer-bar/data/request-state.json;
            default_type application/json;
            add_header Cache-Control "no-store" always;
        }

        # Download now backend: checks the Seerr session itself, holds the Radarr/Sonarr/qBittorrent/SABnzbd keys.
        location ^~ /_download-now/ {
            set $download_now http://download-now:8090;
            proxy_pass $download_now;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            client_max_body_size 4k;
            proxy_read_timeout 60s;
            add_header Cache-Control "no-store" always;
        }

        location /_indexer-bar/ {
            alias /srv/indexer-bar/www/;
            add_header Cache-Control "no-cache" always;
        }

        location / {
            set $seerr http://seerr:5055;
            proxy_pass $seerr;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # uncompressed from Seerr, or sub_filter cannot see </head>
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            sub_filter_once on;
            sub_filter "</head>" '<link rel="stylesheet" href="/_indexer-bar/bar.css"><script src="/_indexer-bar/bar.js" defer></script><script src="/_indexer-bar/can-wait.js" defer></script><script src="/_indexer-bar/menu-links.js" defer></script><script src="/_indexer-bar/night-label.js" defer></script><script src="/_indexer-bar/download-now.js" defer></script></head>';

            # Seerr not up yet (beefy just woke): a page that reloads itself instead of a bare 502.
            error_page 502 504 =503 /_indexer-bar/starting.html;
        }
    }
}
