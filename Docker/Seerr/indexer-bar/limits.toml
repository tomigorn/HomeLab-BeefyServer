# Indexer bar above Seerr (README "Indexer bar"). Read by scripts/indexer-usage.py every minute, no restart needed.
# No secrets here: the repo is public.

# Limits per Prowlarr indexer, by its name in Prowlarr. An indexer not listed here is unlimited (shown with ∞ under "more").
# searches = API calls incl. RSS, downloads = grabs; leave one out = unlimited.
# window = "rolling" (the last 24 h) or "day" (calendar day, Europe/Zurich, resets at midnight).
# Keep Prowlarr's own Query/Grab Limit (indexer settings) the same, so Prowlarr stops before the indexer blocks the account.
[indexers."Treasure Maps"]
downloads = 400
window = "rolling"

[indexers."NzbPlanet"]
searches = 20000
window = "day"

# Subtitle providers (Bazarr), by Bazarr provider id. Window: calendar day UTC (00:00 UTC = 01:00 CET / 02:00 CEST).
# searches = API requests, downloads = subtitle downloads; leave one out = no limit shown. approx = counts that are estimated (≈ in the bar).
# premium = true: paid account without a [[subscriptions]] entry (★ in the bar); a [[subscriptions]] entry with the same name gives the ★ too.
# SubDL free plan: exact usage and limits from its /api/v1/me (secrets/indexer-bar, scripts/subtitle-keys.py); the numbers here and the ≈ estimate from Bazarr's jobs only when that fails.
[subtitles.subdl]
name = "SubDL"
searches = 2000
downloads = 50
approx = ["searches"]

# OpenSubtitles.com free account: downloads used / allowed from its /api/v1/infos/user (VIP = ★); Bazarr pauses it (DownloadLimitExceeded) when hit.
[subtitles.opensubtitlescom]
name = "OpenSubtitles"

# Paid services (days left, ★ on every bar row with the same name) come from fastpi: Docker/Due-Dates/due-dates.toml in HomeLab-FastPi, entries with show = ["seerr"]. Renew there, not here.
# A [[subscriptions]] entry here (name, kind, expires = YYYY-MM-DD or lifetime = true) is added to that list; keep it for something only this bar knows.
