# Indexer bar above Seerr (README "Indexer bar"). Read by scripts/indexer-usage.py every minute, no restart needed.
# No secrets here: the repo is public.

# Limits per Prowlarr indexer, by its name in Prowlarr. An indexer not listed here is unlimited (shown with ∞ under "more").
# searches = API calls incl. RSS, downloads = grabs; leave one out = unlimited.
# window = "rolling" (the last 24 h) or "day" (calendar day, Europe/Zurich, resets at midnight).
# Keep Prowlarr's own Query/Grab Limit (indexer settings) the same, so Prowlarr stops before the indexer blocks the account.
[indexers."Treasure Maps"]
downloads = 400
window = "rolling"

[indexers."NzbPlanet"]
searches = 20000
window = "day"

# Subtitle providers (Bazarr), by Bazarr provider id. Window: calendar day UTC (00:00 UTC = 01:00 CET / 02:00 CEST).
# searches = API requests, downloads = subtitle downloads; leave one out = no limit shown. approx = counts that are estimated (≈ in the bar).
# SubDL free plan: 2000 API requests and 50 downloads a day (its /api/v1/me usage endpoint is Pro-only, so searches are estimated from Bazarr's jobs).
[subtitles.subdl]
name = "SubDL"
searches = 2000
downloads = 50
approx = ["searches"]

# OpenSubtitles.com free account: daily download limit; Bazarr pauses it (DownloadLimitExceeded) when hit.
[subtitles.opensubtitlescom]
name = "OpenSubtitles"

# Paid or time-limited services: shown with days left. After a renewal change only the date.
# expires = the day it ends (YYYY-MM-DD, no quotes), or lifetime = true.
[[subscriptions]]
name = "Treasure Maps"
kind = "indexer"
expires = 2031-11-17

[[subscriptions]]
name = "Eweka"
kind = "Usenet provider"
expires = 2026-11-18

[[subscriptions]]
name = "ProtonVPN Plus"
kind = "VPN"
expires = 2027-06-15

[[subscriptions]]
name = "NZBgeek"
kind = "indexer"
lifetime = true

[[subscriptions]]
name = "NzbPlanet"
kind = "indexer"
lifetime = true
