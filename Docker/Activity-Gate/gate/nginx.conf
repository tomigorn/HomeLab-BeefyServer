# activity-gate: read-only allow-list in front of Jellyfin, Radarr, Sonarr and the Seerr bar files for fastpi's activity page (README).
# Exact request lines only (path and query string); keys come from /tmp/keys.conf, written by start.sh from the secret files.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    default_type application/json;
    access_log off;
    log_not_found off;
    server_tokens off;
    keepalive_timeout 0;
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_timeout 5s;

    # Docker DNS, re-resolved every 10 s: a recreated upstream gets a new IP and the gate starts without its upstreams.
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /tmp/keys.conf;

    proxy_connect_timeout 2s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Accept application/json;
    proxy_hide_header Set-Cookie;

    # fastpi (the activity service), and 127.0.0.1 for the healthcheck and the post-update check inside the container
    geo $gate_client {
        default        0;
        192.168.1.2/32 1;
        127.0.0.1/32   1;
    }

    server {
        listen 8080;

        allow 192.168.1.2;
        allow 127.0.0.1;
        deny all;
        # `return` runs before allow/deny, so refuse other clients here too
        if ($gate_client = 0) {
            return 403;
        }
        if ($request_method != GET) {
            return 405;
        }

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /jellyfin/Sessions {
            if ($request_uri != "/jellyfin/Sessions?ActiveWithinSeconds=60") {
                return 404;
            }
            set $up jellyfin;
            proxy_set_header Authorization $jellyfin_auth;
            proxy_pass http://$up:8096/Sessions?ActiveWithinSeconds=60;
        }

        location = /radarr/api/v3/queue {
            if ($request_uri != "/radarr/api/v3/queue?pageSize=200&includeMovie=true") {
                return 404;
            }
            set $up radarr;
            proxy_set_header X-Api-Key $radarr_key;
            proxy_pass http://$up:7878/api/v3/queue?pageSize=200&includeMovie=true;
        }

        location = /sonarr/api/v3/queue {
            if ($request_uri != "/sonarr/api/v3/queue?pageSize=500&includeSeries=true&includeEpisode=true") {
                return 404;
            }
            set $up sonarr;
            proxy_set_header X-Api-Key $sonarr_key;
            proxy_pass http://$up:8989/api/v3/queue?pageSize=500&includeSeries=true&includeEpisode=true;
        }

        location = /sonarr/api/v3/series {
            if ($request_uri != "/sonarr/api/v3/series") {
                return 404;
            }
            set $up sonarr;
            proxy_set_header X-Api-Key $sonarr_key;
            proxy_pass http://$up:8989/api/v3/series;
        }

        location = /seerr/request-state.json {
            if ($request_uri != "/seerr/request-state.json") {
                return 404;
            }
            add_header Cache-Control no-store;
            alias /srv/seerr-bar/request-state.json;
        }

        location = /seerr/night-waiting.json {
            if ($request_uri != "/seerr/night-waiting.json") {
                return 404;
            }
            add_header Cache-Control no-store;
            alias /srv/seerr-bar/night-waiting.json;
        }

        location / {
            return 404;
        }
    }
}
