// Beefy idle-watcher: apt/dpkg holds its own keep-awake file (/run/beefy-keep-awake.d/apt) so beefy can't power off mid-transaction; other holds stay.
DPkg::Pre-Invoke  { "mkdir -p /run/beefy-keep-awake.d && : > /run/beefy-keep-awake.d/apt"; };
DPkg::Post-Invoke { "rm -f /run/beefy-keep-awake.d/apt; true"; };
