# beefy-mover tunables. Sourced by systemd (EnvironmentFile) AND by the script.
# NOTE: systemd does NOT support inline '# comments' after a value — keep comments
# on their own lines only. Same trap the idle-watcher config hit.
# Restart is not needed; the timer picks this up on its next run.

# Demote only when free space drops below this (GiB).
START_FREE_GIB=300

# ...and stop once it climbs back above this (GiB). The gap is hysteresis: without
# it the mover would demote a trickle every single night forever.
TARGET_FREE_GIB=500

# Safety rail: never move more than this per run (GiB). A runaway policy bug then
# costs one night of churn rather than the whole hot tier. 0 = move nothing, which
# is a usable kill switch.
MAX_MOVE_GIB=2000

# 1 = log what it would do and change nothing. Flip to 0 only after reading a real
# night's dry-run output, exactly as the idle-watcher was commissioned.
DRY_RUN=1
