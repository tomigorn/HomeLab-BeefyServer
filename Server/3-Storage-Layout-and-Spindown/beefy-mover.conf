# beefy-mover tunables. Sourced by systemd (EnvironmentFile); comments on their own lines only (systemd has no inline comments).
# Picked up on the next run, no restart. Storage doc §5 and Docker/Movie-Downloads/README.md "Storage limits".

# Start when the hot SSD is this full (%, 1 - f_bavail/f_blocks of the branch), stop once at or under the target.
START_USED_PCT=70
TARGET_USED_PCT=60

# A title moves only when nobody played it and it was not added in this many days (Jellyfin LastPlayedDate, Radarr/Sonarr dateAdded).
IDLE_DAYS=30
# From this SSD fill on, titles older than FALLBACK_DAYS may move too (so new downloads keep landing on the SSD).
FALLBACK_USED_PCT=75
FALLBACK_DAYS=7

# Per-run bounds: no title starts that cannot finish by DEADLINE (local time) at 1.5 x size / RATE_MIB_S; at most MAX_MOVE_GIB per run (0 = kill switch).
DEADLINE=04:40
RATE_MIB_S=200
MAX_MOVE_GIB=600

# Keep this much of the HDD free (%), and skip titles changed in the last SETTLE_HOURS (imports in progress).
HDD_RESERVE_PCT=10
SETTLE_HOURS=24

# 1 = log what it would do and change nothing.
DRY_RUN=0
