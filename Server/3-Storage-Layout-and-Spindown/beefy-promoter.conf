# beefy-promoter tunables. Sourced by systemd (EnvironmentFile).
# NOTE: systemd does NOT support inline '# comments' after a value — keep comments
# on their own lines only. Restart after editing:
#   sudo systemctl restart beefy-promoter

# LOOPBACK BY DEFAULT. This is a root service that accepts a path over HTTP, so it
# is deliberately not on the LAN.
#
# Jellyfin runs in a container, so it cannot reach 127.0.0.1 of the host. Give the
# Jellyfin service:
#     extra_hosts:
#       - "host.docker.internal:host-gateway"
# and point the webhook at http://host.docker.internal:9002/promote . Then set
# LISTEN_HOST to the docker bridge gateway (172.17.0.1) rather than 0.0.0.0, and add
# a ufw rule allowing only the docker subnet to reach this port.
LISTEN_HOST=127.0.0.1
LISTEN_PORT=9002

# Do not promote the same title twice within this many seconds. A detail page gets
# reopened, and one user action can fire several webhooks; a second copy is wasted
# QVO write endurance.
DEDUPE_SECONDS=3600

# Someone browsing quickly must not queue the whole library onto the SSD.
MAX_PER_HOUR=6

# 1 = log what it would do and change nothing. Commission it the same way as the
# idle-watcher and the mover: watch a real day of output before arming.
DRY_RUN=1
