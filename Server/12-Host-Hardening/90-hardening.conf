# Same as fastpi /etc/sysctl.d/90-hardening.conf (security scan 2026-10-31). Install: sudo install -m 0644 to /etc/sysctl.d/, then sudo sysctl --system
# Kernel info leaks to unprivileged users.
kernel.kptr_restrict = 1
kernel.dmesg_restrict = 1
# No ICMP redirects from a host that is not a router for the LAN; log spoofed source addresses.
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.log_martians = 1
# Loose reverse-path filter (strict breaks Docker asymmetric paths); no magic SysRq.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
kernel.sysrq = 0
# No ICMP redirects accepted (IPv4 and IPv6), martians logged on new interfaces too; FIFOs, setuid dumps, tty line disciplines (security review 2026-11-24, FH-07/BF-07).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.default.log_martians = 1
fs.protected_fifos = 2
fs.suid_dumpable = 0
dev.tty.ldisc_autoload = 0
net.ipv6.conf.enp6s0.accept_redirects = 0
